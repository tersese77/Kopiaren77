name: Linux RDP XFCE

on:
  workflow_dispatch:

jobs:
  linux-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: Install XFCE and XRDP
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            xauth \
            policykit-1 \
            curl \
            wget

          echo "XFCE + XRDP berhasil diinstall"

      - name: Create RDP User
        run: |
          set -e

          USERNAME="rdpuser"
          PASSWORD="RdpUser@12345"

          if id "$USERNAME" >/dev/null 2>&1; then
            echo "User sudah ada"
          else
            sudo useradd \
              -m \
              -s /bin/bash \
              "$USERNAME"
          fi

          echo "$USERNAME:$PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo "$USERNAME"

          sudo mkdir -p "/home/$USERNAME"

          sudo chown -R \
            "$USERNAME:$USERNAME" \
            "/home/$USERNAME"

      - name: Configure XFCE
        run: |
          set -e

          USERNAME="rdpuser"
          HOME_DIR="/home/$USERNAME"

          # Bersihkan session XFCE lama
          sudo -u "$USERNAME" rm -rf \
            "$HOME_DIR/.cache/sessions"

          sudo -u "$USERNAME" rm -rf \
            "$HOME_DIR/.config/xfce4/xfconf"

          sudo -u "$USERNAME" mkdir -p \
            "$HOME_DIR/.config/xfce4"

          # Session XFCE sederhana
          sudo tee "$HOME_DIR/.xsession" > /dev/null <<'EOF'
          #!/bin/sh

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          exec startxfce4
          EOF

          sudo chmod +x "$HOME_DIR/.xsession"

          sudo chown \
            "$USERNAME:$USERNAME" \
            "$HOME_DIR/.xsession"

          echo "XFCE session:"
          sudo cat "$HOME_DIR/.xsession"

      - name: Configure XRDP
        run: |
          set -e

          # Backup konfigurasi
          sudo cp \
            /etc/xrdp/startwm.sh \
            /etc/xrdp/startwm.sh.backup

          # Startup XRDP sederhana
          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          if [ -r "$HOME/.profile" ]; then
              . "$HOME/.profile"
          fi

          exec startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          # Permission certificate
          sudo adduser xrdp ssl-cert || true

          # Restart XRDP
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          sleep 5

          echo
          echo "========================================"
          echo "XRDP STATUS"
          echo "========================================"

          sudo systemctl is-active xrdp

          echo
          echo "PORT 3389"

          sudo ss -lntp | grep ':3389' || true

      - name: Test XFCE
        run: |
          echo "========================================"
          echo "TEST XFCE"
          echo "========================================"

          echo
          echo "startxfce4:"
          command -v startxfce4 || true

          echo
          echo "xfce4-session:"
          command -v xfce4-session || true

          echo
          echo "xfconfd:"
          command -v xfconfd || true

          echo
          echo "xrdp:"
          command -v xrdp || true

          echo
          echo "XRDP:"
          sudo systemctl status xrdp --no-pager || true

          echo
          echo "PORT:"
          sudo ss -lntp | grep ':3389' || true

      - name: Install Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -e

          if [ -z "$TS_AUTHKEY" ]; then
            echo "ERROR: TS_AUTHKEY belum dibuat."
            exit 1
          fi

          curl -fsSL \
            https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="github-linux-rdp-${GITHUB_RUN_ID}"

          sleep 5

          echo
          echo "========================================"
          echo "TAILSCALE"
          echo "========================================"

          sudo tailscale status

          echo
          echo "TAILSCALE IP:"

          sudo tailscale ip -4

      - name: Show RDP Information
        run: |
          TS_IP=$(sudo tailscale ip -4 | head -1)

          echo
          echo "=============================================="
          echo "             LINUX RDP READY"
          echo "=============================================="
          echo
          echo "ADDRESS : $TS_IP:3389"
          echo "USER    : rdpuser"
          echo "PASS    : RdpUser@12345"
          echo "DESKTOP : XFCE"
          echo
          echo "=============================================="

      - name: Keep RDP Alive
        run: |
          TS_IP=$(sudo tailscale ip -4 | head -1)

          echo
          echo "=============================================="
          echo "              RDP AKTIF"
          echo "=============================================="
          echo
          echo "RDP  : $TS_IP:3389"
          echo "USER : rdpuser"
          echo "PASS : RdpUser@12345"
          echo

          while true; do

            echo "[$(date '+%Y-%m-%d %H:%M:%S')]"

            if sudo systemctl is-active --quiet xrdp; then
              echo "XRDP: RUNNING"
            else
              echo "XRDP: STOPPED - RESTART"
              sudo systemctl restart xrdp
            fi

            if sudo ss -lnt | grep -q ':3389'; then
              echo "PORT 3389: OPEN"
            else
              echo "PORT 3389: CLOSED"
            fi

            echo "RDP: $TS_IP:3389"
            echo

            sleep 60

          done
