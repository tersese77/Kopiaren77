name: Debian Desktop RDP

on:
  workflow_dispatch:

jobs:
  debian-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      VM_DIR: /home/runner/work/_temp/debian-desktop
      VM_DISK: /home/runner/work/_temp/debian-desktop/debian.qcow2
      SEED_ISO: /home/runner/work/_temp/debian-desktop/seed.iso
      RDP_PORT: 3390
      SSH_PORT: 2222

    steps:

      # =========================================================
      # 1. CHECK KVM
      # =========================================================
      - name: Check KVM
        run: |
          set -eux

          echo "Checking KVM..."

          if [ ! -e /dev/kvm ]; then
            echo "ERROR: /dev/kvm tidak tersedia."
            exit 1
          fi

          sudo chmod 666 /dev/kvm

          ls -l /dev/kvm

          echo "KVM OK"

      # =========================================================
      # 2. INSTALL TOOLS
      # =========================================================
      - name: Install Tools
        run: |
          set -eux

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            cloud-image-utils \
            wget \
            curl \
            openssh-client \
            netcat-openbsd

      # =========================================================
      # 3. PREPARE VM
      # =========================================================
      - name: Prepare VM
        run: |
          set -eux

          rm -rf "$VM_DIR"

          mkdir -p "$VM_DIR"

          chmod 755 "$VM_DIR"

      # =========================================================
      # 4. DOWNLOAD DEBIAN 13
      # =========================================================
      - name: Download Debian 13
        run: |
          set -eux

          cd "$VM_DIR"

          echo "Downloading Debian 13..."

          wget -O debian.qcow2 \
            https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2

          echo "Download selesai."

          qemu-img info debian.qcow2

      # =========================================================
      # 5. RESIZE DISK
      # =========================================================
      - name: Resize Disk
        run: |
          set -eux

          qemu-img resize "$VM_DISK" 30G

          qemu-img info "$VM_DISK"

      # =========================================================
      # 6. CREATE CLOUD INIT
      # =========================================================
      - name: Create Cloud Init
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -eux

          if [ -z "$RDP_PASSWORD" ]; then
            echo "ERROR:"
            echo "GitHub Secret RDP_PASSWORD belum dibuat."
            exit 1
          fi

          cat > "$VM_DIR/user-data" <<EOF
          #cloud-config

          hostname: debian-desktop

          manage_etc_hosts: true

          users:
            - name: gamer
              gecos: Debian Desktop
              groups:
                - sudo
                - audio
                - video
              sudo:
                - "ALL=(ALL) NOPASSWD:ALL"
              shell: /bin/bash
              lock_passwd: false
              plain_text_passwd: "$RDP_PASSWORD"

          ssh_pwauth: true

          package_update: true

          packages:
            - xfce4
            - xfce4-goodies
            - xrdp
            - xorg
            - xorgxrdp
            - dbus-x11
            - pulseaudio
            - pulseaudio-utils
            - firefox-esr
            - sudo
            - nano
            - htop
            - curl
            - wget

          write_files:

            - path: /home/gamer/.xsession
              owner: gamer:gamer
              permissions: "0644"
              content: |
                xfce4-session

            - path: /etc/xrdp/startwm.sh
              permissions: "0755"
              content: |
                #!/bin/sh

                unset DBUS_SESSION_BUS_ADDRESS
                unset XDG_RUNTIME_DIR

                export XDG_CURRENT_DESKTOP=XFCE
                export XDG_SESSION_DESKTOP=xfce

                exec startxfce4

          runcmd:

            - usermod -aG ssl-cert xrdp || true

            - chown gamer:gamer /home/gamer/.xsession

            - chmod 644 /home/gamer/.xsession

            - systemctl enable xrdp

            - systemctl restart xrdp

            - systemctl enable ssh

            - systemctl restart ssh

            - |
              echo "====================================="
              echo "DEBIAN DESKTOP READY"
              echo "====================================="

          final_message: |
            Debian XFCE Desktop selesai diinstall.
          EOF

          cat > "$VM_DIR/meta-data" <<EOF
          instance-id: debian-desktop-001
          local-hostname: debian-desktop
          EOF

      # =========================================================
      # 7. CREATE SEED ISO
      # =========================================================
      - name: Create Cloud Init ISO
        run: |
          set -eux

          cd "$VM_DIR"

          cloud-localds \
            "$SEED_ISO" \
            user-data \
            meta-data

          ls -lh "$SEED_ISO"

      # =========================================================
      # 8. START QEMU
      # =========================================================
      - name: Start Debian VM
        run: |
          set -eux

          cd "$VM_DIR"

          rm -f qemu.log

          echo "Starting Debian VM..."

          sudo qemu-system-x86_64 \
            -enable-kvm \
            -machine type=pc,accel=kvm \
            -cpu host \
            -smp 4 \
            -m 4096 \
            -drive file="$VM_DISK",if=virtio,format=qcow2 \
            -drive file="$SEED_ISO",if=virtio,format=raw,readonly=on \
            -netdev user,id=net0,hostfwd=tcp::${SSH_PORT}-:22,hostfwd=tcp::${RDP_PORT}-:3389 \
            -device virtio-net-pci,netdev=net0 \
            -vga virtio \
            -display none \
            -serial file:"$VM_DIR/qemu.log" \
            -daemonize

          sleep 10

          echo ""
          echo "Checking QEMU..."

          if sudo pgrep -x qemu-system-x86_64 >/dev/null; then
            echo "QEMU RUNNING"
          else
            echo "QEMU FAILED"

            sudo tail -200 "$VM_DIR/qemu.log" || true

            exit 1
          fi

          echo ""
          echo "QEMU berhasil."
          echo "Tidak menggunakan qemu.pid."

      # =========================================================
      # 9. INSTALL TAILSCALE
      # =========================================================
      - name: Install Tailscale
        run: |
          set -eux

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo systemctl enable --now tailscaled

          sleep 3

      # =========================================================
      # 10. CONNECT TAILSCALE
      # =========================================================
      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -eux

          if [ -z "$TS_AUTHKEY" ]; then
            echo "ERROR:"
            echo "GitHub Secret TS_AUTHKEY belum dibuat."
            exit 1
          fi

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="debian-desktop"

          sleep 5

          TS_IP=$(tailscale ip -4)

          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"

          echo ""
          echo "========================================"
          echo "TAILSCALE IP"
          echo "========================================"
          echo "$TS_IP"

      # =========================================================
      # 11. WAIT RDP
      # =========================================================
      - name: Wait Desktop
        run: |
          set -eux

          echo "Menunggu Debian Desktop..."

          for i in $(seq 1 60); do

            if nc -z 127.0.0.1 "$RDP_PORT"; then

              echo ""
              echo "========================================"
              echo "RDP READY"
              echo "========================================"

              exit 0
            fi

            echo "Menunggu RDP... $i/60"

            sleep 10

          done

          echo ""
          echo "RDP tidak berhasil terbuka."

          echo ""
          echo "=== QEMU LOG ==="

          sudo tail -200 "$VM_DIR/qemu.log" || true

          exit 1

      # =========================================================
      # 12. CONNECTION INFO
      # =========================================================
      - name: Show Connection Info
        run: |
          echo ""
          echo "================================================"
          echo "          DEBIAN DESKTOP AKTIF"
          echo "================================================"
          echo ""
          echo "RDP ADDRESS:"
          echo ""
          echo "$TS_IP:$RDP_PORT"
          echo ""
          echo "USERNAME:"
          echo ""
          echo "gamer"
          echo ""
          echo "PASSWORD:"
          echo ""
          echo "Gunakan nilai GitHub Secret RDP_PASSWORD"
          echo ""
          echo "DESKTOP:"
          echo ""
          echo "XFCE"
          echo ""
          echo "RESOURCES:"
          echo ""
          echo "CPU : 4 Core"
          echo "RAM : 4 GB"
          echo "DISK: 30 GB"
          echo ""
          echo "================================================"

      # =========================================================
      # 13. FINAL TEST
      # =========================================================
      - name: Final Test
        run: |
          set -eux

          echo "Checking QEMU..."

          sudo pgrep -a qemu-system-x86_64

          echo ""
          echo "Checking RDP..."

          nc -z 127.0.0.1 "$RDP_PORT"

          echo ""
          echo "Checking Tailscale..."

          tailscale status

          echo ""
          echo "ALL SYSTEMS OK"

      # =========================================================
      # 14. KEEP ALIVE
      # =========================================================
      - name: Keep Desktop Alive
        run: |
          echo ""
          echo "================================================"
          echo "       DEBIAN DESKTOP SIAP DIGUNAKAN"
          echo "================================================"
          echo ""
          echo "RDP:"
          echo "$TS_IP:$RDP_PORT"
          echo ""
          echo "USER:"
          echo "gamer"
          echo ""
          echo "Workflow akan terus berjalan."
          echo "Jangan tekan Cancel jika masih ingin memakai VM."
          echo ""

          while true; do

            echo ""
            echo "----------------------------------------"
            date

            if sudo pgrep -x qemu-system-x86_64 >/dev/null; then
              echo "QEMU : RUNNING"
            else
              echo "QEMU : STOPPED"
              exit 1
            fi

            if nc -z 127.0.0.1 "$RDP_PORT"; then
              echo "RDP  : OPEN"
            else
              echo "RDP  : CLOSED"
            fi

            echo "TAILSCALE:"
            tailscale ip -4 || true

            sleep 60

          done

      # =========================================================
      # 15. DEBUG
      # =========================================================
      - name: Debug
        if: always()
        run: |
          echo "========== QEMU =========="
          sudo pgrep -a qemu-system-x86_64 || true

          echo ""
          echo "========== QEMU LOG =========="
          sudo tail -200 "$VM_DIR/qemu.log" 2>/dev/null || true

          echo ""
          echo "========== TAILSCALE =========="
          tailscale status 2>/dev/null || true
