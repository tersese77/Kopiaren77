name: Proxmox VE Experimental Runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proxmox:
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    env:
      PVE_VERSION: "9.2-1"
      PVE_ISO: "proxmox-ve_9.2-1.iso"
      PVE_ISO_URL: "https://download.proxmox.com/iso/proxmox-ve_9.2-1.iso"
      PVE_ISO_SHA256: "4e88fe416df9b527624a175f24c9aa07c714d3332afb1ee3dbf3879573ef2c6c"
      VM_DISK: "/tmp/proxmox-ve.qcow2"
      VM_DISK_SIZE: "8G"
      VM_RAM: "4096"
      VM_CPUS: "2"
      VNC_PORT: "5901"
      SSH_FORWARD_PORT: "2222"
      WEB_FORWARD_PORT: "8006"

    steps:
      - name: Show runner resources
        run: |
          set -euxo pipefail
          uname -a
          echo "CPU:"
          nproc
          echo "RAM:"
          free -h
          echo "Disk:"
          df -h /
          echo "KVM:"
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm
          else
            echo "/dev/kvm is NOT available"
          fi

      - name: Install QEMU and utilities
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            cpu-checker \
            wget \
            curl \
            socat
          qemu-system-x86_64 --version

      - name: Check KVM and choose acceleration
        id: accel
        run: |
          set -euo pipefail

          if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "accel=kvm" >> "$GITHUB_OUTPUT"
            echo "KVM is available. Nested virtualization may be possible."
          else
            echo "accel=tcg" >> "$GITHUB_OUTPUT"
            echo "WARNING: /dev/kvm is unavailable."
            echo "QEMU will use software emulation. Proxmox may boot, but KVM guests inside it will NOT be usable."
          fi

      - name: Download Proxmox VE ISO
        run: |
          set -euxo pipefail
          wget -q --show-progress -O "$PVE_ISO" "$PVE_ISO_URL"
          echo "$PVE_ISO_SHA256  $PVE_ISO" | sha256sum -c -
          ls -lh "$PVE_ISO"

      - name: Create VM disk
        run: |
          set -euxo pipefail
          qemu-img create -f qcow2 "$VM_DISK" "$VM_DISK_SIZE"
          qemu-img info "$VM_DISK"

      - name: Start Proxmox installer VM
        run: |
          set -euxo pipefail

          ACCEL="${{ steps.accel.outputs.accel }}"

          if [ "$ACCEL" = "kvm" ]; then
            CPU_ARGS="-cpu host"
            ACCEL_ARGS="-enable-kvm"
          else
            CPU_ARGS="-cpu max"
            ACCEL_ARGS="-accel tcg,thread=multi"
          fi

          # The installer is intentionally interactive.
          # VNC is exposed on localhost:5901 for the duration of the job.
          # Port 8006 is forwarded to the guest, but it will only answer
          # after Proxmox VE has actually been installed and booted.
          nohup qemu-system-x86_64 \
            $ACCEL_ARGS \
            $CPU_ARGS \
            -machine q35 \
            -m "$VM_RAM" \
            -smp "$VM_CPUS" \
            -drive "file=$VM_DISK,if=virtio,format=qcow2" \
            -cdrom "$PVE_ISO" \
            -boot order=d,menu=on \
            -netdev user,id=net0,hostfwd=tcp::${WEB_FORWARD_PORT}-:8006,hostfwd=tcp::${SSH_FORWARD_PORT}-:22 \
            -device virtio-net-pci,netdev=net0 \
            -vnc 127.0.0.1:1 \
            -serial mon:stdio \
            > /tmp/qemu.log 2>&1 &

          echo $! > /tmp/qemu.pid
          sleep 5

          if ! kill -0 "$(cat /tmp/qemu.pid)" 2>/dev/null; then
            echo "QEMU failed to start."
            cat /tmp/qemu.log
            exit 1
          fi

          echo "QEMU is running."
          echo "VNC: 127.0.0.1:5901"
          echo "Proxmox Web UI (after installation): http://127.0.0.1:${WEB_FORWARD_PORT}"
          echo "SSH (after installation): ssh -p ${SSH_FORWARD_PORT} root@127.0.0.1"

      - name: Optional Tailscale access
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        if: ${{ env.TS_AUTHKEY != '' }}
        run: |
          set -euxo pipefail

          # Tailscale is optional. Add a repository secret named
          # TAILSCALE_AUTHKEY if you want private tailnet access.
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="gha-proxmox-${GITHUB_RUN_ID}"

          sudo apt-get install -y novnc websockify

          # VNC console for the interactive Proxmox installer.
          nohup websockify --web=/usr/share/novnc/ 127.0.0.1:6080 127.0.0.1:${VNC_PORT} \
            > /tmp/novnc.log 2>&1 &

          sleep 3

          # Private tailnet URLs. Serve is only reachable by devices in your
          # Tailscale network.
          sudo tailscale serve --bg --set-path=/installer 6080
          sudo tailscale serve --bg --set-path=/proxmox https+insecure://127.0.0.1:${WEB_FORWARD_PORT}

          echo "Tailscale status:"
          sudo tailscale status
          echo
          echo "Tailscale Serve configuration:"
          sudo tailscale serve status || true
          echo
          echo "Open /installer for the Proxmox installer console."
          echo "After installation/reboot, open /proxmox for the PVE Web UI."

      - name: Keep VM alive and print diagnostics
        run: |
          set -u

          echo "============================================================"
          echo "PROXMOX EXPERIMENT"
          echo "============================================================"
          echo "Runner is ephemeral: everything disappears when this job ends."
          echo "Proxmox ISO: $PVE_VERSION"
          echo "VM RAM: $VM_RAM MB"
          echo "VM CPUs: $VM_CPUS"
          echo "VNC: localhost:$VNC_PORT"
          echo "Web UI forward: localhost:$WEB_FORWARD_PORT"
          echo "SSH forward: localhost:$SSH_FORWARD_PORT"
          echo
          echo "Important:"
          echo "1. The Proxmox installer is interactive."
          echo "2. GitHub-hosted runners cannot be treated as a permanent VPS."
          echo "3. If KVM is unavailable, nested Proxmox virtualization will not work."
          echo "4. This workflow is for testing only."
          echo "============================================================"

          # Keep the runner alive so QEMU remains running.
          # Cancel the workflow when you are finished.
          for i in $(seq 1 19500); do
            if ! kill -0 "$(cat /tmp/qemu.pid)" 2>/dev/null; then
              echo "QEMU stopped."
              cat /tmp/qemu.log || true
              exit 0
            fi

            if [ $((i % 30)) -eq 0 ]; then
              echo "--- QEMU status $(date -u) ---"
              tail -n 20 /tmp/qemu.log || true
            fi

            sleep 1
          done

      - name: Stop VM
        if: always()
        run: |
          if [ -f /tmp/qemu.pid ]; then
            kill "$(cat /tmp/qemu.pid)" 2>/dev/null || true
          fi
          sleep 2
          cat /tmp/qemu.log 2>/dev/null || true

      - name: Upload QEMU log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxmox-qemu-log
          path: /tmp/qemu.log
          if-no-files-found: ignore
