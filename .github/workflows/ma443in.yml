name: XAUUSD AI Web

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn requests

      # =========================
      # TAILSCALE
      # =========================
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Check Tailscale
        run: |
          echo "===== TAILSCALE STATUS ====="
          tailscale status

          echo ""
          echo "===== TAILSCALE IP ====="
          tailscale ip -4

      # =========================
      # 9ROUTER
      # =========================
      - name: Install 9Router
        run: |
          npm install -g 9router

      - name: Start 9Router
        run: |
          nohup 9router > 9router.log 2>&1 &

          sleep 15

          echo "===== 9ROUTER LOG ====="
          cat 9router.log || true

      # =========================
      # FASTAPI
      # =========================
      - name: Create Web App
        run: |

          cat > main.py <<'PY'

          from fastapi import FastAPI
          from fastapi.responses import HTMLResponse
          from pydantic import BaseModel
          import requests

          app = FastAPI()

          ROUTER_URL = "http://127.0.0.1:20128/v1/chat/completions"


          class AnalysisRequest(BaseModel):
              price: float
              timeframe: str


          @app.get("/", response_class=HTMLResponse)
          def home():

              return """
              <!DOCTYPE html>

              <html>

              <head>

              <meta name="viewport"
                    content="width=device-width, initial-scale=1">

              <title>XAUUSD AI</title>

              <style>

              body {
                  background:#0d1117;
                  color:white;
                  font-family:Arial;
                  padding:20px;
              }

              .box {
                  max-width:700px;
                  margin:auto;
              }

              input,select,button {
                  width:100%;
                  padding:14px;
                  margin:8px 0;
                  box-sizing:border-box;
                  border-radius:8px;
              }

              button {
                  background:#238636;
                  color:white;
                  border:0;
                  font-weight:bold;
              }

              #result {
                  white-space:pre-wrap;
                  background:#161b22;
                  padding:15px;
                  margin-top:20px;
                  border-radius:10px;
              }

              </style>

              </head>

              <body>

              <div class="box">

              <h1>🥇 XAUUSD AI ANALYZER</h1>

              <input
                  id="price"
                  type="number"
                  step="0.01"
                  placeholder="Harga XAUUSD">

              <select id="timeframe">

                  <option>M5</option>
                  <option>M15</option>
                  <option selected>H1</option>
                  <option>H4</option>
                  <option>D1</option>

              </select>

              <button onclick="analyze()">
                  ANALISA XAUUSD
              </button>

              <div id="result">
                  Belum ada analisis.
              </div>

              </div>

              <script>

              async function analyze() {

                  const price =
                      document.getElementById("price").value;

                  const timeframe =
                      document.getElementById("timeframe").value;

                  document.getElementById("result").innerText =
                      "⏳ Menganalisa...";

                  const r = await fetch("/analyze", {

                      method:"POST",

                      headers:{
                          "Content-Type":"application/json"
                      },

                      body:JSON.stringify({
                          price:Number(price),
                          timeframe:timeframe
                      })

                  });

                  const data = await r.json();

                  document.getElementById("result").innerText =
                      data.result ||
                      JSON.stringify(data,null,2);

              }

              </script>

              </body>
              </html>
              """


          @app.get("/health")
          def health():

              return {
                  "status":"online",
                  "service":"XAUUSD AI"
              }


          @app.post("/analyze")
          def analyze(req: AnalysisRequest):

              prompt = f"""

              Analisis XAUUSD.

              Harga:
              {req.price}

              Timeframe:
              {req.timeframe}

              Gunakan konsep:

              - Smart Money Concept
              - Market Structure
              - BOS
              - CHoCH
              - Liquidity
              - Order Block
              - Support Resistance
              - Fibonacci
              - Fundamental Gold

              Berikan:

              BIAS:
              BUY / SELL / WAIT

              TREND:

              MARKET STRUCTURE:

              ORDER BLOCK:

              SUPPORT:

              RESISTANCE:

              FIBONACCI:

              FUNDAMENTAL:

              ENTRY:

              STOP LOSS:

              TP1:

              TP2:

              TP3:

              RISK REWARD:

              INVALIDATION:

              Jangan mengarang data candle yang tidak tersedia.

              """

              payload = {

                  "model":"auto",

                  "messages":[

                      {
                          "role":"system",
                          "content":
                          "You are an XAUUSD trading analyst."
                      },

                      {
                          "role":"user",
                          "content":prompt
                      }

                  ]

              }

              try:

                  r = requests.post(
                      ROUTER_URL,
                      json=payload,
                      timeout=180
                  )

                  data = r.json()

                  if "choices" in data:

                      return {
                          "result":
                          data["choices"][0]["message"]["content"]
                      }

                  return data

              except Exception as e:

                  return {
                      "error":str(e)
                  }

          PY

      # =========================
      # START WEB
      # =========================
      - name: Start Web
        run: |

          nohup python -m uvicorn main:app \
            --host 0.0.0.0 \
            --port 8000 \
            > app.log 2>&1 &

          sleep 5

          echo "===== WEB TEST ====="

          curl http://127.0.0.1:8000/health

      # =========================
      # SHOW ADDRESS
      # =========================
      - name: Show Web Address
        run: |

          IP=$(tailscale ip -4 | head -n 1)

          echo ""
          echo "================================="
          echo "XAUUSD WEB ONLINE"
          echo "================================="
          echo ""
          echo "IP TAILSCALE:"
          echo "$IP"
          echo ""
          echo "BUKA DI HP:"
          echo "http://$IP:8000"
          echo ""
          echo "================================="

      # =========================
      # KEEP ALIVE
      # =========================
      - name: Keep Alive
        run: |

          echo "SERVER AKTIF"

          while true
          do
              echo "[$(date)] XAUUSD AI ONLINE"
              sleep 300
          done
