name: Ubuntu SSH

on:
  workflow_dispatch:

jobs:
  ubuntu-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Info Ubuntu
        run: |
          echo "=== UBUNTU ==="
          cat /etc/os-release
          echo
          echo "=== PUBLIC IP ==="
          curl -s https://api.ipify.org
          echo
          echo "=== LOCAL IP ==="
          hostname -I
          echo

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y curl wget git nano

      - name: SSH Session
        uses: mxschmitt/action-tmate@v3
