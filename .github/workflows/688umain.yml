name: Debian KVM Desktop Wine MT5

on:
  workflow_dispatch:

jobs:
  debian-kvm:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      VM_NAME: debian-mt5
      VM_RAM: 4096
      VM_CPUS: 4
      VM_DISK: 20G

    steps:

      # ============================================================
      # 1. CHECK KVM
      # ============================================================
      - name: Check KVM
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "SYSTEM"
          echo "========================================"

          uname -a
          nproc
          free -h
          df -h

          echo "========================================"
          echo "KVM"
          echo "========================================"

          if [ ! -e /dev/kvm ]; then
            echo "ERROR: /dev/kvm tidak tersedia."
            exit 1
          fi

          sudo chmod 666 /dev/kvm

          ls -lah /dev/kvm

          echo "KVM READY"

      # ============================================================
      # 2. INSTALL QEMU
      # ============================================================
      - name: Install QEMU
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            qemu-kvm \
            cloud-image-utils \
            wget \
            curl \
            git \
            netcat-openbsd \
            openssh-client

          echo "========================================"
          echo "QEMU VERSION"
          echo "========================================"

          qemu-system-x86_64 --version

      # ============================================================
      # 3. PREPARE VM DIRECTORY
      # ============================================================
      - name: Prepare VM
        shell: bash
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/vm"

          cd "$RUNNER_TEMP/vm"

          echo "VM directory:"
          pwd

      # ============================================================
      # 4. DOWNLOAD DEBIAN 13
      # ============================================================
      - name: Download Debian 13
        shell: bash
        run: |
          set -eux

          cd "$RUNNER_TEMP/vm"

          wget \
            --show-progress \
            -O debian.qcow2 \
            "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"

          ls -lh debian.qcow2

      # ============================================================
      # 5. RESIZE DISK
      # ============================================================
      - name: Resize Debian Disk
        shell: bash
        run: |
          set -eux

          cd "$RUNNER_TEMP/vm"

          qemu-img resize \
            debian.qcow2 \
            "$VM_DISK"

          qemu-img info debian.qcow2

      # ============================================================
      # 6. CREATE SSH KEY
      # ============================================================
      - name: Create SSH Key
        shell: bash
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/ssh"

          ssh-keygen \
            -t ed25519 \
            -N "" \
            -f "$RUNNER_TEMP/ssh/id_ed25519"

          echo "SSH_PUBLIC_KEY=$(cat "$RUNNER_TEMP/ssh/id_ed25519.pub")" >> "$GITHUB_ENV"

      # ============================================================
      # 7. CREATE CLOUD INIT
      # ============================================================
      - name: Create Cloud Init
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -eux

          cd "$RUNNER_TEMP/vm"

          if [ -z "$TS_AUTHKEY" ]; then
            echo "ERROR: TS_AUTHKEY belum dibuat."
            echo ""
            echo "Buat:"
            echo "Settings -> Secrets and variables -> Actions"
            echo "Name: TS_AUTHKEY"
            exit 1
          fi

          cat > user-data <<EOF
          #cloud-config

          hostname: debian-mt5

          manage_etc_hosts: true

          ssh_pwauth: false

          users:
            - name: debian
              gecos: Debian MT5
              groups:
                - sudo
              sudo:
                - ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
              lock_passwd: true
              ssh_authorized_keys:
                - ${SSH_PUBLIC_KEY}

          package_update: true

          package_upgrade: false

          packages:
            - openssh-server

            - xfce4
            - xfce4-goodies
            - xfce4-terminal

            - xvfb
            - x11vnc
            - dbus-x11

            - wine
            - wine64
            - wine32
            - fonts-wine
            - winbind

            - wget
            - curl
            - ca-certificates
            - git
            - nano
            - htop
            - net-tools
            - iproute2
            - procps
            - psmisc

          write_files:

            # ------------------------------------------------------
            # DESKTOP
            # ------------------------------------------------------
            - path: /home/debian/start-desktop.sh
              owner: debian:debian
              permissions: '0755'
              content: |
                #!/bin/bash

                export DISPLAY=:1

                mkdir -p /home/debian/.config

                if ! pgrep -f "Xvfb :1" >/dev/null 2>&1; then

                  Xvfb :1 \
                    -screen 0 1280x720x24 \
                    -ac \
                    +extension GLX \
                    +render \
                    -noreset \
                    > /home/debian/xvfb.log 2>&1 &

                  sleep 5

                fi

                if ! pgrep -f "xfce4-session" >/dev/null 2>&1; then

                  dbus-launch \
                    --exit-with-session \
                    startxfce4 \
                    > /home/debian/xfce.log 2>&1 &

                fi

            # ------------------------------------------------------
            # VNC
            # ------------------------------------------------------
            - path: /home/debian/start-vnc.sh
              owner: debian:debian
              permissions: '0755'
              content: |
                #!/bin/bash

                export DISPLAY=:1

                sleep 15

                if ! pgrep -f "x11vnc.*5900" >/dev/null 2>&1; then

                  x11vnc \
                    -display :1 \
                    -rfbport 5900 \
                    -forever \
                    -shared \
                    -nopw \
                    -noxdamage \
                    -repeat \
                    > /home/debian/vnc.log 2>&1 &

                fi

            # ------------------------------------------------------
            # NOVNC
            # ------------------------------------------------------
            - path: /home/debian/start-novnc.sh
              owner: debian:debian
              permissions: '0755'
              content: |
                #!/bin/bash

                sleep 20

                if [ ! -d /home/debian/noVNC ]; then

                  cd /home/debian

                  git clone \
                    --depth 1 \
                    https://github.com/novnc/noVNC.git

                  git clone \
                    --depth 1 \
                    https://github.com/novnc/websockify.git \
                    /home/debian/noVNC/utils/websockify

                fi

                if ! pgrep -f "novnc_proxy.*6080" >/dev/null 2>&1; then

                  cd /home/debian/noVNC

                  ./utils/novnc_proxy \
                    --vnc 127.0.0.1:5900 \
                    --listen 0.0.0.0:6080 \
                    > /home/debian/novnc.log 2>&1 &

                fi

            # ------------------------------------------------------
            # WINE
            # ------------------------------------------------------
            - path: /home/debian/setup-wine.sh
              owner: debian:debian
              permissions: '0755'
              content: |
                #!/bin/bash

                export DISPLAY=:1
                export WINEPREFIX=/home/debian/.wine

                wineboot -u \
                  > /home/debian/wineboot.log 2>&1

                sleep 15

            # ------------------------------------------------------
            # MT5 INSTALLER
            # ------------------------------------------------------
            - path: /home/debian/install-mt5.sh
              owner: debian:debian
              permissions: '0755'
              content: |
                #!/bin/bash

                export DISPLAY=:1
                export WINEPREFIX=/home/debian/.wine

                cd /home/debian

                if [ ! -f /home/debian/mt5setup.exe ]; then

                  wget \
                    --show-progress \
                    -O /home/debian/mt5setup.exe \
                    "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

                fi

                echo "Starting MT5 installer..."

                wine /home/debian/mt5setup.exe \
                  > /home/debian/mt5-install.log 2>&1 &

            # ------------------------------------------------------
            # MT5 STARTER
            # ------------------------------------------------------
            - path: /home/debian/start-mt5.sh
              owner: debian:debian
              permissions: '0755'
              content: |
                #!/bin/bash

                export DISPLAY=:1
                export WINEPREFIX=/home/debian/.wine

                echo "Searching MT5..."

                MT5=""

                for i in $(seq 1 60); do

                  MT5=$(find \
                    /home/debian/.wine/drive_c \
                    -type f \
                    -iname "terminal64.exe" \
                    2>/dev/null \
                    | head -1)

                  if [ -n "$MT5" ]; then
                    break
                  fi

                  echo "MT5 belum ditemukan... $i/60"

                  sleep 5

                done

                if [ -z "$MT5" ]; then

                  echo "MT5 executable tidak ditemukan."

                  echo "Installer log:"
                  tail -100 /home/debian/mt5-install.log 2>/dev/null || true

                  exit 0

                fi

                echo "================================"
                echo "MT5 FOUND"
                echo "================================"

                echo "$MT5"

                sleep 5

                wine "$MT5" \
                  > /home/debian/mt5.log 2>&1 &

            # ------------------------------------------------------
            # TAILSCALE
            # ------------------------------------------------------
            - path: /root/setup-tailscale.sh
              owner: root:root
              permissions: '0755'
              content: |
                #!/bin/bash

                curl -fsSL \
                  https://tailscale.com/install.sh \
                  | sh

                systemctl enable tailscaled

                systemctl restart tailscaled

                sleep 10

                tailscale up \
                  --authkey="${TS_AUTHKEY}" \
                  --hostname="debian-mt5-${GITHUB_RUN_ID}" \
                  --accept-dns=false

          runcmd:

            # SSH
            - systemctl enable ssh
            - systemctl restart ssh

            # Desktop
            - su - debian -c "/home/debian/start-desktop.sh"

            # Wine
            - su - debian -c "/home/debian/setup-wine.sh"

            # VNC
            - su - debian -c "/home/debian/start-vnc.sh"

            # noVNC
            - su - debian -c "/home/debian/start-novnc.sh"

            # Tailscale
            - /root/setup-tailscale.sh

            # MT5
            - su - debian -c "/home/debian/install-mt5.sh"

            # Wait installer
            - sleep 60

            # Start MT5
            - su - debian -c "/home/debian/start-mt5.sh"

          final_message: "Debian KVM MT5 ready."

          EOF

          cat > meta-data <<EOF
          instance-id: debian-mt5-${GITHUB_RUN_ID}
          local-hostname: debian-mt5
          EOF

          cloud-localds \
            seed.iso \
            user-data \
            meta-data

          echo "========================================"
          echo "CLOUD INIT"
          echo "========================================"

          ls -lh seed.iso

      # ============================================================
      # 8. START QEMU/KVM
      # ============================================================
      - name: Start Debian KVM
        shell: bash
        run: |
          set -eux

          cd "$RUNNER_TEMP/vm"

          echo "========================================"
          echo "START DEBIAN KVM"
          echo "========================================"

          sudo qemu-system-x86_64 \
            -enable-kvm \
            -machine type=pc,accel=kvm \
            -cpu host \
            -smp "$VM_CPUS" \
            -m "$VM_RAM" \
            -drive file=debian.qcow2,if=virtio,format=qcow2 \
            -drive file=seed.iso,if=virtio,format=raw,readonly=on \
            -netdev user,id=net0,hostfwd=tcp::2222-:22,hostfwd=tcp::5901-:5900,hostfwd=tcp::6080-:6080 \
            -device virtio-net-pci,netdev=net0 \
            -vga virtio \
            -display none \
            -serial file:"$RUNNER_TEMP/vm/qemu-serial.log" \
            -daemonize \
            -pidfile "$RUNNER_TEMP/qemu.pid"

          sleep 10

          echo "========================================"
          echo "QEMU PID"
          echo "========================================"

          cat "$RUNNER_TEMP/qemu.pid"

          echo ""
          echo "========================================"
          echo "QEMU PROCESS"
          echo "========================================"

          ps aux | grep qemu | grep -v grep || true

          echo ""
          echo "========================================"
          echo "KVM"
          echo "========================================"

          ls -lah /dev/kvm

      # ============================================================
      # 9. WAIT SSH
      # ============================================================
      - name: Wait Debian Boot
        shell: bash
        run: |
          set -eux

          echo "Menunggu Debian boot..."

          READY="false"

          for i in $(seq 1 90); do

            if nc -z 127.0.0.1 2222 2>/dev/null; then

              echo "SSH Debian sudah aktif."

              READY="true"

              break

            fi

            echo "Booting Debian... $i/90"

            sleep 5

          done

          if [ "$READY" != "true" ]; then

            echo "ERROR: SSH Debian tidak aktif."

            echo ""
            echo "Serial log:"

            tail -200 \
              "$RUNNER_TEMP/vm/qemu-serial.log" \
              || true

            exit 1

          fi

      # ============================================================
      # 10. WAIT CLOUD INIT
      # ============================================================
      - name: Wait Cloud Init
        shell: bash
        run: |
          set +e

          echo "Menunggu cloud-init..."

          for i in $(seq 1 90); do

            STATUS=$(ssh \
              -i "$RUNNER_TEMP/ssh/id_ed25519" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=5 \
              -p 2222 \
              debian@127.0.0.1 \
              "cloud-init status --wait 2>/dev/null" \
              2>/dev/null || true)

            echo "$STATUS"

            if echo "$STATUS" | grep -q "done"; then

              echo "Cloud-init selesai."

              break

            fi

            sleep 5

          done

      # ============================================================
      # 11. WAIT NOVNC
      # ============================================================
      - name: Wait Desktop
        shell: bash
        run: |
          set -eux

          echo "Menunggu noVNC..."

          READY="false"

          for i in $(seq 1 90); do

            if nc -z 127.0.0.1 6080 2>/dev/null; then

              echo "noVNC aktif."

              READY="true"

              break

            fi

            echo "Menunggu desktop... $i/90"

            sleep 5

          done

          if [ "$READY" != "true" ]; then

            echo "ERROR: noVNC tidak aktif."

            exit 1

          fi

      # ============================================================
      # 12. GET TAILSCALE IP
      # ============================================================
      - name: Get Tailscale IP
        shell: bash
        run: |
          set +e

          echo "Mencari Tailscale IP..."

          TS_IP=""

          for i in $(seq 1 60); do

            TS_IP=$(ssh \
              -i "$RUNNER_TEMP/ssh/id_ed25519" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=5 \
              -p 2222 \
              debian@127.0.0.1 \
              "sudo tailscale ip -4 2>/dev/null | head -1" \
              2>/dev/null || true)

            if [ -n "$TS_IP" ]; then

              echo "Tailscale IP:"
              echo "$TS_IP"

              echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"

              break

            fi

            echo "Tailscale belum siap... $i/60"

            sleep 5

          done

          if [ -z "$TS_IP" ]; then

            echo "WARNING: Tailscale IP belum ditemukan."

          fi

      # ============================================================
      # 13. CHECK EVERYTHING
      # ============================================================
      - name: Final Test
        shell: bash
        run: |
          set +e

          echo ""
          echo "========================================"
          echo "DEBIAN KVM STATUS"
          echo "========================================"

          echo ""
          echo "QEMU:"
          ps aux | grep qemu | grep -v grep

          echo ""
          echo "KVM:"
          ls -lah /dev/kvm

          echo ""
          echo "LOCAL PORTS:"
          ss -lntp | grep -E "2222|5901|6080" || true

          echo ""
          echo "========================================"
          echo "DEBIAN"
          echo "========================================"

          ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            debian@127.0.0.1 \
            "cat /etc/debian_version"

          echo ""
          echo "========================================"
          echo "WINE"
          echo "========================================"

          ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            debian@127.0.0.1 \
            "WINEPREFIX=/home/debian/.wine wine --version"

          echo ""
          echo "========================================"
          echo "MT5"
          echo "========================================"

          ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            debian@127.0.0.1 \
            "pgrep -af 'terminal.*exe' || true"

          echo ""
          echo "========================================"
          echo "TAILSCALE"
          echo "========================================"

          ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            debian@127.0.0.1 \
            "sudo tailscale status || true"

          echo ""
          echo "========================================"
          echo "REMOTE ACCESS"
          echo "========================================"

          if [ -n "${TS_IP:-}" ]; then

            echo ""
            echo "Tailscale IP:"
            echo "$TS_IP"

            echo ""
            echo "noVNC:"
            echo "http://$TS_IP:6080/vnc.html"

            echo ""
            echo "VNC:"
            echo "$TS_IP:5900"

          fi

      # ============================================================
      # 14. KEEP ALIVE
      # ============================================================
      - name: Keep Debian KVM Alive
        shell: bash
        run: |
          set +e

          echo ""
          echo "========================================"
          echo "DEBIAN + XFCE + WINE + MT5 READY"
          echo "========================================"

          echo ""
          echo "Tailscale IP:"
          echo "$TS_IP"

          echo ""
          echo "noVNC:"
          echo "http://$TS_IP:6080/vnc.html"

          echo ""
          echo "========================================"

          while true; do

            echo ""
            echo "========================================"
            echo "$(date)"
            echo "========================================"

            QPID=""

            if [ -f "$RUNNER_TEMP/qemu.pid" ]; then
              QPID=$(cat "$RUNNER_TEMP/qemu.pid")
            fi

            if [ -n "$QPID" ] && kill -0 "$QPID" 2>/dev/null; then

              echo "QEMU: RUNNING"

            else

              echo "QEMU: STOPPED"

              exit 1

            fi

            echo ""
            echo "Debian processes:"

            ssh \
              -i "$RUNNER_TEMP/ssh/id_ed25519" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=5 \
              -p 2222 \
              debian@127.0.0.1 \
              "pgrep -af 'Xvfb|xfce4-session|x11vnc|novnc|terminal.*exe' || true" \
              2>/dev/null || true

            echo ""
            echo "Ports:"

            ss -lntp | grep -E "2222|5901|6080" || true

            sleep 60

          done

      # ============================================================
      # 15. DEBUG
      # ============================================================
      - name: Debug
        if: failure()
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "DEBUG"
          echo "========================================"

          echo ""
          echo "QEMU:"
          ps aux | grep qemu || true

          echo ""
          echo "KVM:"
          ls -lah /dev/kvm || true

          echo ""
          echo "PORTS:"
          ss -lntp || true

          echo ""
          echo "SERIAL LOG:"
          tail -300 \
            "$RUNNER_TEMP/vm/qemu-serial.log" \
            2>/dev/null || true

          echo ""
          echo "SSH TEST:"

          ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=5 \
            -p 2222 \
            debian@127.0.0.1 \
            "echo SSH_OK; echo '--- CLOUD INIT ---'; sudo cloud-init status --long; echo '--- PROCESSES ---'; ps aux; echo '--- MT5 LOG ---'; tail -100 /home/debian/mt5.log 2>/dev/null; echo '--- MT5 INSTALL ---'; tail -100 /home/debian/mt5-install.log 2>/dev/null; echo '--- XFCE ---'; tail -100 /home/debian/xfce.log 2>/dev/null; echo '--- VNC ---'; tail -100 /home/debian/vnc.log 2>/dev/null; echo '--- NOVNC ---'; tail -100 /home/debian/novnc.log 2>/dev/null" \
            || true
