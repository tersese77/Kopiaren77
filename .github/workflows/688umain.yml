name: Debian KVM Desktop Wine

on:
  workflow_dispatch:

jobs:
  debian-kvm:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      VM_RAM: 4096
      VM_CPUS: 4
      VM_DISK: 20G

    steps:

      # ============================================================
      # 1. CHECK KVM
      # ============================================================
      - name: Check KVM
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "SYSTEM"
          echo "========================================"

          uname -a
          nproc
          free -h
          df -h

          echo "========================================"
          echo "KVM"
          echo "========================================"

          if [ ! -e /dev/kvm ]; then
            echo "ERROR: /dev/kvm tidak tersedia."
            exit 1
          fi

          sudo chmod 666 /dev/kvm

          ls -lah /dev/kvm

          echo "KVM READY"

      # ============================================================
      # 2. INSTALL QEMU
      # ============================================================
      - name: Install QEMU
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            qemu-kvm \
            cloud-image-utils \
            wget \
            curl \
            git \
            netcat-openbsd \
            openssh-client

          qemu-system-x86_64 --version

      # ============================================================
      # 3. PREPARE VM
      # ============================================================
      - name: Prepare VM
        shell: bash
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/vm"
          mkdir -p "$RUNNER_TEMP/ssh"

      # ============================================================
      # 4. DOWNLOAD DEBIAN 13
      # ============================================================
      - name: Download Debian 13
        shell: bash
        run: |
          set -eux

          cd "$RUNNER_TEMP/vm"

          wget \
            --show-progress \
            -O debian.qcow2 \
            "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"

          ls -lh debian.qcow2

      # ============================================================
      # 5. RESIZE DISK
      # ============================================================
      - name: Resize Disk
        shell: bash
        run: |
          set -eux

          cd "$RUNNER_TEMP/vm"

          qemu-img resize \
            debian.qcow2 \
            "$VM_DISK"

          qemu-img info debian.qcow2

      # ============================================================
      # 6. CREATE SSH KEY
      # ============================================================
      - name: Create SSH Key
        shell: bash
        run: |
          set -eux

          ssh-keygen \
            -t ed25519 \
            -N "" \
            -f "$RUNNER_TEMP/ssh/id_ed25519"

          SSH_PUBLIC_KEY=$(cat "$RUNNER_TEMP/ssh/id_ed25519.pub")

          echo "SSH_PUBLIC_KEY=$SSH_PUBLIC_KEY" >> "$GITHUB_ENV"

      # ============================================================
      # 7. CREATE CLOUD INIT
      # ============================================================
      - name: Create Cloud Init
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -eux

          cd "$RUNNER_TEMP/vm"

          if [ -z "$TS_AUTHKEY" ]; then
            echo "ERROR: TS_AUTHKEY belum dibuat."
            exit 1
          fi

          cat > user-data <<EOF
          #cloud-config

          hostname: debian-desktop

          manage_etc_hosts: true

          ssh_pwauth: false

          users:
            - name: debian
              gecos: Debian Desktop
              groups:
                - sudo
              sudo:
                - ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
              lock_passwd: true
              ssh_authorized_keys:
                - ${SSH_PUBLIC_KEY}

          package_update: true

          packages:
            - openssh-server

            # XFCE DESKTOP
            - xfce4
            - xfce4-goodies
            - xfce4-terminal
            - thunar

            # DISPLAY
            - xvfb
            - x11vnc
            - dbus-x11

            # WINE
            - wine
            - wine64
            - wine32
            - fonts-wine
            - winbind

            # BROWSER
            - firefox-esr

            # UTILITIES
            - wget
            - curl
            - ca-certificates
            - git
            - nano
            - htop
            - net-tools
            - iproute2
            - procps
            - psmisc

          write_files:

            # ======================================================
            # DESKTOP
            # ======================================================
            - path: /home/debian/start-desktop.sh
              owner: debian:debian
              permissions: '0755'
              content: |
                #!/bin/bash

                export DISPLAY=:1

                if ! pgrep -f "Xvfb :1" >/dev/null 2>&1; then

                  Xvfb :1 \
                    -screen 0 1366x768x24 \
                    -ac \
                    +extension GLX \
                    +render \
                    -noreset \
                    > /home/debian/xvfb.log 2>&1 &

                  sleep 5

                fi

                if ! pgrep -f "xfce4-session" >/dev/null 2>&1; then

                  dbus-launch \
                    --exit-with-session \
                    startxfce4 \
                    > /home/debian/xfce.log 2>&1 &

                fi

            # ======================================================
            # VNC
            # ======================================================
            - path: /home/debian/start-vnc.sh
              owner: debian:debian
              permissions: '0755'
              content: |
                #!/bin/bash

                export DISPLAY=:1

                sleep 15

                if ! pgrep -f "x11vnc.*5900" >/dev/null 2>&1; then

                  x11vnc \
                    -display :1 \
                    -rfbport 5900 \
                    -forever \
                    -shared \
                    -nopw \
                    -noxdamage \
                    -repeat \
                    > /home/debian/vnc.log 2>&1 &

                fi

            # ======================================================
            # NOVNC
            # ======================================================
            - path: /home/debian/start-novnc.sh
              owner: debian:debian
              permissions: '0755'
              content: |
                #!/bin/bash

                sleep 20

                if [ ! -d /home/debian/noVNC ]; then

                  cd /home/debian

                  git clone \
                    --depth 1 \
                    https://github.com/novnc/noVNC.git

                  git clone \
                    --depth 1 \
                    https://github.com/novnc/websockify.git \
                    /home/debian/noVNC/utils/websockify

                fi

                cd /home/debian/noVNC

                if ! pgrep -f "novnc_proxy" >/dev/null 2>&1; then

                  ./utils/novnc_proxy \
                    --vnc 127.0.0.1:5900 \
                    --listen 0.0.0.0:6080 \
                    > /home/debian/novnc.log 2>&1 &

                fi

            # ======================================================
            # WINE SETUP
            # ======================================================
            - path: /home/debian/setup-wine.sh
              owner: debian:debian
              permissions: '0755'
              content: |
                #!/bin/bash

                export DISPLAY=:1
                export WINEPREFIX=/home/debian/.wine

                wineboot -u \
                  > /home/debian/wineboot.log 2>&1

                sleep 15

                echo "================================"
                echo "WINE READY"
                echo "================================"

                wine --version

            # ======================================================
            # TAILSCALE
            # ======================================================
            - path: /root/setup-tailscale.sh
              owner: root:root
              permissions: '0755'
              content: |
                #!/bin/bash

                curl -fsSL \
                  https://tailscale.com/install.sh \
                  | sh

                systemctl enable tailscaled

                systemctl restart tailscaled

                sleep 10

                tailscale up \
                  --authkey="__TS_AUTHKEY__" \
                  --hostname="debian-desktop" \
                  --accept-dns=false

          runcmd:

            # SSH
            - systemctl enable ssh
            - systemctl restart ssh

            # Desktop
            - su - debian -c "/home/debian/start-desktop.sh"

            # Wine
            - su - debian -c "/home/debian/setup-wine.sh"

            # VNC
            - su - debian -c "/home/debian/start-vnc.sh"

            # noVNC
            - su - debian -c "/home/debian/start-novnc.sh"

            # Tailscale
            - sed -i "s|__TS_AUTHKEY__|${TS_AUTHKEY}|g" /root/setup-tailscale.sh
            - /root/setup-tailscale.sh

          final_message: "Debian Desktop + Wine ready."

          EOF

          cat > meta-data <<EOF
          instance-id: debian-desktop-${GITHUB_RUN_ID}
          local-hostname: debian-desktop
          EOF

          cloud-localds \
            seed.iso \
            user-data \
            meta-data

          ls -lh seed.iso

      # ============================================================
      # 8. START KVM
      # ============================================================
      - name: Start Debian KVM
        shell: bash
        run: |
          set -eux

          cd "$RUNNER_TEMP/vm"

          sudo qemu-system-x86_64 \
            -enable-kvm \
            -machine type=pc,accel=kvm \
            -cpu host \
            -smp "$VM_CPUS" \
            -m "$VM_RAM" \
            -drive file=debian.qcow2,if=virtio,format=qcow2 \
            -drive file=seed.iso,if=virtio,format=raw,readonly=on \
            -netdev user,id=net0,hostfwd=tcp::2222-:22,hostfwd=tcp::5901-:5900,hostfwd=tcp::6080-:6080 \
            -device virtio-net-pci,netdev=net0 \
            -vga virtio \
            -display none \
            -serial file:"$RUNNER_TEMP/vm/qemu-serial.log" \
            -daemonize \
            -pidfile "$RUNNER_TEMP/qemu.pid"

          sleep 10

          echo "QEMU PID:"
          cat "$RUNNER_TEMP/qemu.pid"

          echo "QEMU:"
          ps aux | grep qemu | grep -v grep || true

      # ============================================================
      # 9. WAIT DEBIAN
      # ============================================================
      - name: Wait Debian Boot
        shell: bash
        run: |
          set -eux

          READY=false

          for i in $(seq 1 90); do

            if nc -z 127.0.0.1 2222 2>/dev/null; then

              echo "Debian SSH READY"

              READY=true
              break

            fi

            echo "Waiting Debian boot $i/90"

            sleep 5

          done

          if [ "$READY" != "true" ]; then

            echo "Debian gagal boot."

            tail -200 \
              "$RUNNER_TEMP/vm/qemu-serial.log" \
              || true

            exit 1

          fi

      # ============================================================
      # 10. WAIT DESKTOP
      # ============================================================
      - name: Wait Desktop
        shell: bash
        run: |
          set -eux

          READY=false

          for i in $(seq 1 90); do

            if nc -z 127.0.0.1 6080 2>/dev/null; then

              echo "noVNC READY"

              READY=true
              break

            fi

            echo "Waiting XFCE/noVNC $i/90"

            sleep 5

          done

          if [ "$READY" != "true" ]; then

            echo "noVNC gagal start."

            exit 1

          fi

      # ============================================================
      # 11. GET TAILSCALE IP
      # ============================================================
      - name: Get Tailscale IP
        shell: bash
        run: |
          set +e

          TS_IP=""

          for i in $(seq 1 60); do

            TS_IP=$(ssh \
              -i "$RUNNER_TEMP/ssh/id_ed25519" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=5 \
              -p 2222 \
              debian@127.0.0.1 \
              "sudo tailscale ip -4 2>/dev/null | head -1" \
              2>/dev/null || true)

            if [ -n "$TS_IP" ]; then

              echo "Tailscale IP:"
              echo "$TS_IP"

              echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"

              break

            fi

            echo "Waiting Tailscale $i/60"

            sleep 5

          done

          if [ -z "$TS_IP" ]; then
            echo "WARNING: Tailscale IP belum ditemukan."
          fi

      # ============================================================
      # 12. FINAL TEST
      # ============================================================
      - name: Final Test
        shell: bash
        run: |
          set +e

          echo ""
          echo "========================================"
          echo "DEBIAN DESKTOP READY"
          echo "========================================"

          echo ""
          echo "Debian:"
          ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            debian@127.0.0.1 \
            "cat /etc/debian_version"

          echo ""
          echo "Wine:"
          ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            debian@127.0.0.1 \
            "wine --version"

          echo ""
          echo "========================================"
          echo "TAILSCALE"
          echo "========================================"

          echo "$TS_IP"

          echo ""
          echo "========================================"
          echo "OPEN THIS FROM YOUR PHONE"
          echo "========================================"

          echo "http://$TS_IP:6080/vnc.html"

          echo ""
          echo "========================================"
          echo "DESKTOP"
          echo "========================================"

          echo "Debian XFCE"
          echo "Wine installed"
          echo "Firefox installed"
          echo "MT5 NOT installed"
          echo "Download MT5 yourself from Firefox."

      # ============================================================
      # 13. KEEP ALIVE
      # ============================================================
      - name: Keep Debian Alive
        shell: bash
        run: |
          set +e

          echo ""
          echo "========================================"
          echo "DEBIAN DESKTOP RUNNING"
          echo "========================================"

          echo ""
          echo "noVNC:"
          echo "http://$TS_IP:6080/vnc.html"

          echo ""
          echo "Tailscale:"
          echo "$TS_IP"

          echo ""
          echo "========================================"

          while true; do

            echo ""
            echo "----- $(date) -----"

            if [ -f "$RUNNER_TEMP/qemu.pid" ]; then

              QPID=$(cat "$RUNNER_TEMP/qemu.pid")

              if kill -0 "$QPID" 2>/dev/null; then
                echo "QEMU: RUNNING"
              else
                echo "QEMU: STOPPED"
                exit 1
              fi

            fi

            echo ""
            echo "Desktop processes:"

            ssh \
              -i "$RUNNER_TEMP/ssh/id_ed25519" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=5 \
              -p 2222 \
              debian@127.0.0.1 \
              "pgrep -af 'Xvfb|xfce4-session|x11vnc|novnc' || true" \
              2>/dev/null || true

            sleep 60

          done

      # ============================================================
      # 14. DEBUG
      # ============================================================
      - name: Debug
        if: failure()
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "DEBUG"
          echo "========================================"

          echo ""
          echo "KVM:"
          ls -lah /dev/kvm || true

          echo ""
          echo "QEMU:"
          ps aux | grep qemu || true

          echo ""
          echo "PORTS:"
          ss -lntp || true

          echo ""
          echo "QEMU SERIAL:"
          tail -300 \
            "$RUNNER_TEMP/vm/qemu-serial.log" \
            2>/dev/null || true

          echo ""
          echo "DEBIAN PROCESSES:"

          ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=5 \
            -p 2222 \
            debian@127.0.0.1 \
            "ps aux; echo '---'; tail -100 /home/debian/xfce.log 2>/dev/null; echo '---'; tail -100 /home/debian/vnc.log 2>/dev/null; echo '---'; tail -100 /home/debian/novnc.log 2>/dev/null; echo '---'; tail -100 /home/debian/wineboot.log 2>/dev/null" \
            || true
