name: Windows 9Router XAUUSD

on:
  workflow_dispatch:

jobs:
  windows-server:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # ==========================================
      # 1. CHECK WINDOWS
      # ==========================================
      - name: Check Windows
        shell: powershell
        run: |
          Write-Host "================================="
          Write-Host "WINDOWS RUNNER"
          Write-Host "================================="

          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsArchitecture

          Write-Host ""
          Write-Host "PowerShell:"
          $PSVersionTable.PSVersion


      # ==========================================
      # 2. CHECK NODE.JS
      # ==========================================
      - name: Check Node.js
        shell: powershell
        run: |
          node --version
          npm --version


      # ==========================================
      # 3. INSTALL 9ROUTER
      # ==========================================
      - name: Install 9Router
        shell: powershell
        run: |
          Write-Host "Installing 9Router..."

          npm install -g 9router

          Write-Host ""
          Write-Host "9Router installation complete."

          9router --version


      # ==========================================
      # 4. CHECK PYTHON
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # 5. INSTALL FASTAPI
      # ==========================================
      - name: Install Python packages
        shell: powershell
        run: |
          python -m pip install --upgrade pip

          pip install `
            fastapi `
            uvicorn `
            requests

          python --version


      # ==========================================
      # 6. INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        shell: powershell
        run: |

          Write-Host "Downloading Tailscale..."

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "$env:TEMP\tailscale-setup.exe"

          Write-Host "Installing Tailscale..."

          Start-Process `
            "$env:TEMP\tailscale-setup.exe" `
            -ArgumentList "/quiet" `
            -Wait

          Write-Host "Tailscale installation complete."


      # ==========================================
      # 7. START TAILSCALE
      # ==========================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
              Write-Host "ERROR: TS_AUTHKEY belum dibuat."
              exit 1
          }

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
              Write-Host "tailscale.exe tidak ditemukan."
              exit 1
          }

          & $tailscale up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="github-windows-xauusd"

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "================================="
          Write-Host "TAILSCALE STATUS"
          Write-Host "================================="

          & $tailscale status

          Write-Host ""
          Write-Host "TAILSCALE IP:"

          $ip = & $tailscale ip -4

          Write-Host $ip


      # ==========================================
      # 8. CREATE WEB APP
      # ==========================================
      - name: Create XAUUSD Web App
        shell: powershell
        run: |

          @'
          from fastapi import FastAPI
          from fastapi.responses import HTMLResponse

          app = FastAPI(
              title="XAUUSD AI Trading"
          )


          @app.get("/", response_class=HTMLResponse)
          def home():

              return """
              <!DOCTYPE html>

              <html>

              <head>

              <meta name="viewport"
                    content="width=device-width, initial-scale=1">

              <title>XAUUSD AI</title>

              <style>

              body {
                  background:#0d1117;
                  color:white;
                  font-family:Arial;
                  margin:0;
                  padding:20px;
              }

              .container {
                  max-width:700px;
                  margin:auto;
              }

              .card {
                  background:#161b22;
                  padding:20px;
                  border-radius:15px;
                  margin-top:20px;
              }

              input,
              select,
              button {

                  width:100%;
                  padding:14px;
                  margin-top:10px;
                  box-sizing:border-box;
                  border-radius:8px;
                  border:1px solid #30363d;
                  background:#0d1117;
                  color:white;

              }

              button {

                  background:#238636;
                  border:0;
                  font-weight:bold;
                  cursor:pointer;

              }

              </style>

              </head>


              <body>

              <div class="container">

              <h1>🥇 XAUUSD AI</h1>

              <div class="card">

              <h2>Market Analysis</h2>

              <label>
              Harga XAUUSD
              </label>

              <input
                  id="price"
                  type="number"
                  step="0.01"
                  placeholder="Contoh: 3350.50"
              >


              <label>
              Timeframe
              </label>

              <select id="timeframe">

                  <option>M5</option>
                  <option>M15</option>
                  <option selected>H1</option>
                  <option>H4</option>
                  <option>D1</option>

              </select>


              <button onclick="analyze()">
                  ANALISA XAUUSD
              </button>

              </div>


              <div class="card">

              <h2>Hasil</h2>

              <pre id="result">
              Masukkan harga XAUUSD.
              </pre>

              </div>

              </div>


              <script>

              async function analyze() {

                  const price =
                      document.getElementById(
                          "price"
                      ).value;

                  const timeframe =
                      document.getElementById(
                          "timeframe"
                      ).value;


                  document.getElementById(
                      "result"
                  ).innerText =
                      "Menganalisa...";


                  const response =
                      await fetch(
                          "/analyze",
                          {

                              method:"POST",

                              headers:{
                                  "Content-Type":
                                  "application/json"
                              },

                              body:JSON.stringify({

                                  price:Number(price),

                                  timeframe:timeframe

                              })

                          }
                      );


                  const data =
                      await response.json();


                  document.getElementById(
                      "result"
                  ).innerText =
                      data.message ||
                      JSON.stringify(
                          data,
                          null,
                          2
                      );

              }

              </script>

              </body>

              </html>
              """


          @app.get("/health")
          def health():

              return {
                  "status": "online",
                  "service": "XAUUSD AI"
              }


          @app.post("/analyze")
          def analyze(data: dict):

              return {
                  "message":
                  "Web XAUUSD berhasil menerima data.",
                  "price":
                  data.get("price"),
                  "timeframe":
                  data.get("timeframe")
              }

          '@ | Out-File -Encoding utf8 main.py


      # ==========================================
      # 9. START FASTAPI
      # ==========================================
      - name: Start Web App
        shell: powershell
        run: |

          Start-Process `
            python `
            -ArgumentList `
            "-m uvicorn main:app --host 0.0.0.0 --port 8000" `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "================================="
          Write-Host "WEB TEST"
          Write-Host "================================="

          Invoke-WebRequest `
            http://127.0.0.1:8000/health `
            -UseBasicParsing


      # ==========================================
      # 10. SHOW ACCESS
      # ==========================================
      - name: Show Access Information
        shell: powershell
        run: |

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          $ip = & $tailscale ip -4

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "      WINDOWS XAUUSD SERVER ONLINE"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "TAILSCALE IP:"
          Write-Host $ip

          Write-Host ""
          Write-Host "BUKA DARI HP:"
          Write-Host "http://${ip}:8000"

          Write-Host ""
          Write-Host "WEB HEALTH:"
          Write-Host "http://${ip}:8000/health"

          Write-Host ""
          Write-Host "=========================================="


      # ==========================================
      # 11. KEEP ALIVE
      # ==========================================
      - name: Keep Alive
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "================================="
          Write-Host "WINDOWS SERVER AKTIF"
          Write-Host "================================="

          while ($true) {

              $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

              Write-Host "[$time] XAUUSD Web masih aktif."

              Start-Sleep -Seconds 300
          }
