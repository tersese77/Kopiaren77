# AutoClaim — Windows RDP VPS yang bikin + klaim dirinya sendiri
#
# Alur: setiap run -> nyalakan RDP, bikin user random, join Tailscale,
# (opsional) install Hermes + restore config + autostart gateway,
# kirim kredensial ke Telegram, lalu loop jaga hidup sampai job limit 6 jam.
# Setiap run langsung meng-antri run berikutnya (self re-dispatch), jadi
# VPS baru otomatis "create" sebelum yang lama mati — nggak ada gap.
#
# Secrets yang dipakai:
#   TS_AUTHKEY          (wajib)  Tailscale auth key
#   TELEGRAM_BOT_TOKEN  (opsional) token bot untuk notifikasi
#   TELEGRAM_CHAT_ID    (opsional) chat id tujuan notifikasi
#   HERMES_TG_TOKEN     (opsional) token bot KHUSUS runner (beda dari bot lain!)
#   HERMES_CONFIG_B64   (opsional) base64 dari hermes-config-sync.tar.gz
#
# Catatan kuota: job GitHub-hosted max 6 jam. Repo public = menit gratis,
# tapi log-nya publik -> karena itu kredensial HANYA dikirim ke Telegram,
# tidak pernah di-echo ke log workflow.

name: AutoClaim - Windows RDP VPS

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */5 * * *'   # jaring pengaman: kalau self-dispatch gagal

permissions:
  contents: read
  actions: write

concurrency:
  group: autoclaim-rdp
  cancel-in-progress: false   # run berikutnya nunggu di antrean, bukan saling bunuh

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 355        # di bawah limit keras 360 menit
    env:
      RDP_USER: clouduser
      TS_HOSTNAME: github-windows-rdp
      HERMES_HOME: C:\Users\clouduser\AppData\Local\hermes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- CACHE: install Hermes itu ~15 menit, hampir semuanya di tahap npm/browser tools.
      #     Dengan cache ini, runner berikutnya cukup restore (~1 menit) bukan install ulang.
      #     Naikkan angka versi di key kalau cache pernah menyimpan install yang rusak.
      - name: Restore cache install Hermes
        id: hermes_cache
        uses: actions/cache/restore@v4
        with:
          path: C:\Users\clouduser\AppData\Local\hermes\hermes-agent
          key: hermes-agent-win-v2

      # --- DEBUG LIVE: server status di port 8080, bisa dibaca dari tailnet
      #     curl http://<tailnet-ip-runner>:8080/        (status fase)
      #     curl http://<tailnet-ip-runner>:8080/log      (tail log installer)
      - name: Start status server (live debug)
        shell: pwsh
        run: |
          Copy-Item ".\scripts\status-server.ps1" "$env:USERPROFILE\status-server.ps1" -Force
          Start-Process powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',"$env:USERPROFILE\status-server.ps1" -WindowStyle Hidden
          Start-Sleep -Seconds 3
          "[$((Get-Date).ToUniversalTime().ToString('HH:mm:ss'))Z] status server start (runner $env:RUNNER_NAME)" | Out-File "$env:USERPROFILE\status.txt" -Encoding UTF8
          Write-Host "status server jalan (port 8080)"

      # --- AUTO CREATE: antrikan run berikutnya SEBELUM kerja, biar nggak ada gap
      - name: Antrikan run berikutnya (self re-dispatch)
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          try {
            $h = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
            $u = "https://api.github.com/repos/${{ github.repository }}/actions/workflows/autoclaim.yml/dispatches"
            Invoke-RestMethod -Method Post -Uri $u -Headers $h -ContentType 'application/json' -Body '{"ref":"${{ github.ref_name }}"}'
            Write-Host "run berikutnya sudah diantrikan"
          } catch {
            Write-Host "gagal antrikan run berikutnya (cron yang jadi backup): $($_.Exception.Message)"
          }

      # --- BACKUP CHAIN: pulihkan state Hermes dari backup host sebelumnya (artifact).
      # Kalau artifact tidak ada (run pertama / expired), lanjut tanpa restore ->
      # jalur lama HERMES_ENV_B64/HERMES_CONF_B64 tetap dipakai oleh bootstrap.
      - name: Restore state dari backup host sebelumnya
        shell: pwsh
        env:
          HERMES_HOME: C:\Users\clouduser\AppData\Local\hermes
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          RESTORE_BACKUP_URL: ${{ vars.RESTORE_BACKUP_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/runner-restore-backup.ps1

      # --- AUTO CREATE + AUTO CLAIM: seluruh bootstrap dalam satu script
      - name: Bootstrap VPS (RDP + Tailscale + Hermes) & kirim kredensial
        shell: pwsh
        env:
          RDP_USER: clouduser
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          NOTIFY_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NOTIFY_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HERMES_TG_TOKEN: ${{ secrets.HERMES_TG_TOKEN }}
          HERMES_ENV_B64: ${{ secrets.HERMES_ENV_B64 }}
          HERMES_CONF_B64: ${{ secrets.HERMES_CONF_B64 }}
          HERMES_START_NOW: '0'   # gateway dinyalakan belakangan, setelah handover
          BAI_KEYS_B64: ${{ secrets.BAI_KEYS_B64 }}
        run: ./scripts/runner-autoclaim.ps1

      # --- simpan cache install supaya runner berikutnya nggak install ulang 15 menit
      - name: Simpan cache install Hermes
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\Users\clouduser\AppData\Local\hermes\hermes-agent
          key: hermes-agent-win-v2

      # --- HANDOVER: tunggu runner lama keluar dari tailnet, baru ambil alih bot.
      # Ini yang mencegah 409 getUpdates saat dua runner memakai bot token yang sama.
      - name: Ambil alih gateway (tunggu runner lama mati)
        shell: pwsh
        env:
          NOTIFY_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NOTIFY_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HANDOVER_FROM: ${{ vars.HANDOVER_FROM }}
        run: ./scripts/gateway-handover.ps1 -MaxWaitMinutes 240

      # --- BACKUP CHAIN: buat backup state Hermes terenkripsi -> jadi artifact.
      # Artifact ini yang diambil runner BERIKUTNYA saat bootstrap (restore di atas),
      # jadi state berpindah host tiap run tanpa commit ke repo (repo public).
      # Kunci: secret BACKUP_KEY (AES-256-CBC). Tanpa BACKUP_KEY step ini skip aman.
      - name: Backup Hermes state (enkripsi AES -> artifact)
        if: success()
        shell: pwsh
        env:
          HERMES_HOME: C:\Users\clouduser\AppData\Local\hermes
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        run: ./scripts/runner-backup.ps1

      - name: Upload backup sebagai artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-state-backup
          path: ${{ runner.temp }}\hermes-state.tar.gz.enc
          retention-days: 3
          if-no-files-found: ignore

      # --- KEEP ALIVE: ini yang bikin VPS tetap hidup sampai job limit
      - name: Keep RDP + Tailscale alive
        shell: pwsh
        run: |
          Write-Host "================ RDP IS RUNNING ================"
          Write-Host "Jangan cancel workflow ini selama memakai RDP."
          Write-Host "==============================================="
          while ($true) {
            $svc = Get-Service -Name TermService
            if ($svc.Status -ne 'Running') { Start-Service -Name TermService }
            $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
            if (Test-Path $ts) {
              $ip = (& $ts ip -4) -join ''
              Write-Host "[$(Get-Date -Format s)] RDP $ip:3389 | TermService=$((Get-Service TermService).Status)"
            }
            Start-Sleep -Seconds 60
          }
