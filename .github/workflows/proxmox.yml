name: Proxmox VE

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROXMOX_ISO: proxmox-ve_9.2-1.iso
  PROXMOX_URL: https://download.proxmox.com/iso/proxmox-ve_9.2-1.iso
  VM_RAM: 4096
  VM_CPUS: 2
  VM_DISK: 32G

jobs:
  proxmox:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: System Information
        run: |
          echo "===== SYSTEM ====="
          uname -a
          echo
          echo "CPU:"
          nproc
          echo
          echo "RAM:"
          free -h
          echo
          echo "DISK:"
          df -h
          echo
          echo "KVM:"
          if [ -e /dev/kvm ]; then
            echo "/dev/kvm AVAILABLE"
            ls -l /dev/kvm
          else
            echo "/dev/kvm NOT AVAILABLE"
          fi

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-system-x86 qemu-utils ovmf curl wget jq socat \
            net-tools iproute2 ca-certificates
          qemu-system-x86_64 --version

      - name: Check KVM
        id: kvm
        run: |
          if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM tersedia"
            echo "accel=kvm" >> "$GITHUB_OUTPUT"
            echo "cpu=host" >> "$GITHUB_OUTPUT"
          else
            echo "KVM tidak tersedia"
            echo "Menggunakan software emulation"
            echo "accel=tcg" >> "$GITHUB_OUTPUT"
            echo "cpu=max" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Proxmox VE ISO
        run: |
          set -e
          rm -f "$PROXMOX_ISO"
          echo "Downloading Proxmox VE ISO..."
          curl -L --fail --retry 10 --retry-delay 5 \
            --connect-timeout 30 --max-time 1800 \
            --progress-bar -o "$PROXMOX_ISO" "$PROXMOX_URL"
          ls -lh "$PROXMOX_ISO"
          file "$PROXMOX_ISO"
          test -s "$PROXMOX_ISO"
          echo "ISO berhasil didownload."

      - name: Verify ISO
        run: |
          echo "SHA256:"
          sha256sum "$PROXMOX_ISO"

      - name: Create Proxmox Disk
        run: |
          rm -f proxmox-disk.qcow2
          qemu-img create -f qcow2 proxmox-disk.qcow2 "$VM_DISK"
          qemu-img info proxmox-disk.qcow2

      - name: Install Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -e
          if [ -z "$TS_AUTHKEY" ]; then
            echo "ERROR: TS_AUTHKEY belum dibuat."
            exit 1
          fi
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo systemctl enable --now tailscaled
          sleep 3
          sudo tailscale up --auth-key="$TS_AUTHKEY" --hostname="github-proxmox"
          echo "===== TAILSCALE IP ====="
          sudo tailscale ip -4
          echo "===== TAILSCALE STATUS ====="
          sudo tailscale status

      - name: Prepare VM
        run: |
          mkdir -p logs
          touch logs/qemu.log

      - name: Start Proxmox VM
        id: start
        run: |
          set -e
          ACCEL="${{ steps.kvm.outputs.accel }}"
          CPU="${{ steps.kvm.outputs.cpu }}"
          rm -f /tmp/proxmox.pid

          sudo qemu-system-x86_64 \
            -name proxmox \
            -machine q35 \
            -accel "$ACCEL" \
            -cpu "$CPU" \
            -smp "$VM_CPUS" \
            -m "$VM_RAM" \
            -drive file="$GITHUB_WORKSPACE/proxmox-disk.qcow2",format=qcow2,if=virtio \
            -cdrom "$GITHUB_WORKSPACE/$PROXMOX_ISO" \
            -boot order=d \
            -device virtio-net-pci,netdev=net0 \
            -netdev user,id=net0,hostname=proxmox \
            -netdev user,id=net1,hostfwd=tcp:0.0.0.0:8006-:8006,hostfwd=tcp:0.0.0.0:2222-:22 \
            -vga virtio \
            -display none \
            -serial file:"$GITHUB_WORKSPACE/logs/qemu.log" \
            -monitor unix:/tmp/qemu-monitor.sock,server=on,wait=off \
            -daemonize \
            -pidfile /tmp/proxmox.pid

          sleep 5
          test -f /tmp/proxmox.pid
          PID=$(cat /tmp/proxmox.pid)
          kill -0 "$PID"
          echo "Proxmox VM RUNNING - PID: $PID"

      - name: Show Connection Information
        run: |
          sleep 5
          TS_IP=$(sudo tailscale ip -4)
          echo "=========================================="
          echo "       PROXMOX CONNECTION INFO"
          echo "=========================================="
          echo "Tailscale IP: $TS_IP"
          echo "Proxmox Web: https://$TS_IP:8006"
          echo "SSH: $TS_IP:2222"
          echo "QEMU PID: $(cat /tmp/proxmox.pid)"
          echo "=========================================="

      - name: Monitor Proxmox
        run: |
          set -e
          while true; do
            test -f /tmp/proxmox.pid
            PID=$(cat /tmp/proxmox.pid)
            if kill -0 "$PID" 2>/dev/null; then
              echo "Proxmox masih berjalan - $(date)"
              sudo tailscale ip -4 || true
            else
              echo "Proxmox berhenti."
              tail -100 logs/qemu.log || true
              exit 1
            fi
            sleep 30
          done

      - name: Stop Proxmox
        if: always()
        run: |
          set +e
          if [ -f /tmp/proxmox.pid ]; then
            PID=$(cat /tmp/proxmox.pid)
            kill "$PID" 2>/dev/null || true
            sleep 5
          fi
          sudo pkill -f qemu-system-x86_64 || true

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxmox-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 1
