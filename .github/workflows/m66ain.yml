name: XAUUSD AI Analyzer

on:
  workflow_dispatch:

jobs:
  xauusd-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install 9Router
        run: |
          npm install -g 9router

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn requests

      - name: Start 9Router
        run: |
          9router > 9router.log 2>&1 &
          sleep 10

          echo "===== 9ROUTER LOG ====="
          cat 9router.log || true

      - name: Create XAUUSD Web App
        run: |
          cat > main.py <<'PY'
          import os
          import requests

          from fastapi import FastAPI
          from fastapi.responses import HTMLResponse
          from pydantic import BaseModel

          app = FastAPI(title="XAUUSD AI Analyzer")

          ROUTER_URL = "http://127.0.0.1:20128/v1/chat/completions"

          class AnalysisRequest(BaseModel):
              price: float
              timeframe: str = "H1"

          @app.get("/", response_class=HTMLResponse)
          def home():
              return """
              <!DOCTYPE html>
              <html>
              <head>
                  <meta name="viewport"
                        content="width=device-width,initial-scale=1">
                  <title>XAUUSD AI Analyzer</title>
                  <style>
                      body {
                          font-family: Arial;
                          max-width: 700px;
                          margin: auto;
                          padding: 20px;
                          background: #111;
                          color: white;
                      }
                      input, select, button {
                          width: 100%;
                          padding: 12px;
                          margin: 8px 0;
                          box-sizing: border-box;
                      }
                      button {
                          cursor: pointer;
                      }
                      #result {
                          white-space: pre-wrap;
                          margin-top: 20px;
                          padding: 15px;
                          background: #222;
                          border-radius: 10px;
                      }
                  </style>
              </head>

              <body>

                  <h1>🥇 XAUUSD AI Analyzer</h1>

                  <label>Harga XAUUSD</label>
                  <input id="price"
                         type="number"
                         step="0.01"
                         placeholder="Contoh: 3350.50">

                  <label>Timeframe</label>

                  <select id="timeframe">
                      <option>M5</option>
                      <option>M15</option>
                      <option selected>H1</option>
                      <option>H4</option>
                      <option>D1</option>
                  </select>

                  <button onclick="analyze()">
                      ANALISA XAUUSD
                  </button>

                  <div id="result">Hasil analisis akan muncul di sini...</div>

                  <script>
                  async function analyze() {

                      const price =
                          document.getElementById("price").value;

                      const timeframe =
                          document.getElementById("timeframe").value;

                      document.getElementById("result").innerText =
                          "Sedang menganalisa...";

                      const response = await fetch("/analyze", {
                          method: "POST",
                          headers: {
                              "Content-Type": "application/json"
                          },
                          body: JSON.stringify({
                              price: Number(price),
                              timeframe: timeframe
                          })
                      });

                      const data = await response.json();

                      document.getElementById("result").innerText =
                          data.result || data.error;
                  }
                  </script>

              </body>
              </html>
              """

          @app.post("/analyze")
          def analyze(request: AnalysisRequest):

              prompt = f"""
              Kamu adalah AI analis khusus XAUUSD.

              Harga saat ini:
              {request.price}

              Timeframe:
              {request.timeframe}

              Buat analisis berdasarkan:

              1. Market structure
              2. SMC
              3. BOS
              4. CHoCH
              5. Order Block
              6. Support dan Resistance
              7. Fibonacci
              8. Liquidity
              9. Fundamental gold
              10. Bias BUY / SELL / WAIT

              Berikan:

              - Bias utama
              - Alasan
              - Area entry
              - Stop Loss
              - TP1
              - TP2
              - TP3
              - Risk/Reward
              - Level invalidasi

              Jangan mengarang data market yang tidak diberikan.
              Jika data candle atau fundamental tidak tersedia,
              katakan bahwa data tersebut belum tersedia.
              """

              payload = {
                  "model": "auto",
                  "messages": [
                      {
                          "role": "system",
                          "content":
                              "You are a professional XAUUSD market analyst."
                      },
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ]
              }

              try:
                  response = requests.post(
                      ROUTER_URL,
                      json=payload,
                      timeout=180
                  )

                  return response.json()

              except Exception as e:
                  return {
                      "error": str(e)
                  }

          PY

      - name: Start Web App
        run: |
          nohup uvicorn main:app \
            --host 0.0.0.0 \
            --port 8000 \
            > app.log 2>&1 &

          sleep 5

          echo "===== WEB APP ====="
          curl http://127.0.0.1:8000/

      - name: Show status
        run: |
          echo "================================"
          echo "XAUUSD AI ANALYZER ONLINE"
          echo "================================"
          echo "9Router: http://127.0.0.1:20128"
          echo "Web App : http://127.0.0.1:8000"
          echo "================================"

      - name: Keep alive
        run: |
          while true; do
            echo "XAUUSD AI masih berjalan..."
            sleep 300
          done
