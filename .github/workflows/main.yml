name: Linux RDP

on:
  workflow_dispatch:

jobs:
  linux-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: Check Runner
        run: |
          echo "======================================"
          echo "       LINUX RDP XFCE"
          echo "======================================"

          echo "OS:"
          cat /etc/os-release

          echo
          echo "CPU:"
          nproc

          echo
          echo "RAM:"
          free -h

          echo
          echo "DISK:"
          df -h /

      - name: Install XFCE XRDP DBUS
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-session \
            xfconf \
            xfdesktop4 \
            xfwm4 \
            xfce4-terminal \
            xrdp \
            xorgxrdp \
            dbus \
            dbus-x11 \
            dbus-daemon \
            dbus-user-session \
            xauth \
            policykit-1 \
            curl \
            wget

          echo
          echo "======================================"
          echo "PACKAGE CHECK"
          echo "======================================"

          echo "startxfce4:"
          command -v startxfce4 || true

          echo "xfce4-session:"
          command -v xfce4-session || true

          echo "xfconfd:"
          command -v xfconfd || true

          echo "xfce4-terminal:"
          command -v xfce4-terminal || true

          echo "dbus-run-session:"
          command -v dbus-run-session || true

          echo "xrdp:"
          command -v xrdp || true

      - name: Create RDP User
        run: |
          set -e

          USERNAME="rdpuser"
          PASSWORD="RdpUser@12345"

          if id "$USERNAME" >/dev/null 2>&1; then
            echo "User sudah ada."
          else
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$USERNAME"
          fi

          echo "$USERNAME:$PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo "$USERNAME"

          HOME_DIR="/home/$USERNAME"

          sudo mkdir -p "$HOME_DIR"

          sudo chown -R \
            "$USERNAME:$USERNAME" \
            "$HOME_DIR"

          echo
          echo "USER:"
          id "$USERNAME"

      # ============================================================
      # RDP MASUK LANGSUNG KE TERMINAL
      # ============================================================
      - name: Configure RDP Terminal Session
        run: |
          set -e

          USERNAME="rdpuser"
          HOME_DIR="/home/$USERNAME"

          echo "======================================"
          echo "CONFIGURE RDP TERMINAL"
          echo "======================================"

          sudo -u "$USERNAME" mkdir -p \
            "$HOME_DIR/.config/xfce4"

          sudo -u "$USERNAME" rm -rf \
            "$HOME_DIR/.cache/sessions"

          sudo tee "$HOME_DIR/.xsession" > /dev/null <<'EOF'
          #!/bin/sh

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce

          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export XDG_DATA_DIRS=/usr/local/share:/usr/share

          exec dbus-run-session -- xfce4-terminal
          EOF

          sudo chmod +x "$HOME_DIR/.xsession"

          sudo chown \
            "$USERNAME:$USERNAME" \
            "$HOME_DIR/.xsession"

          echo
          echo "FILE .xSESSION:"
          sudo cat "$HOME_DIR/.xsession"

      # ============================================================
      # XRDP
      # ============================================================
      - name: Configure XRDP
        run: |
          set -e

          echo "======================================"
          echo "CONFIGURE XRDP"
          echo "======================================"

          if [ -f /etc/xrdp/startwm.sh ]; then
            sudo cp \
              /etc/xrdp/startwm.sh \
              /etc/xrdp/startwm.sh.backup
          fi

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce

          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export XDG_DATA_DIRS=/usr/local/share:/usr/share

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          if [ -r "$HOME/.profile" ]; then
              . "$HOME/.profile"
          fi

          exec /etc/X11/Xsession
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          sudo adduser xrdp ssl-cert || true

          sudo systemctl enable xrdp

          sudo systemctl restart xrdp

          sleep 5

          echo
          echo "======================================"
          echo "XRDP STATUS"
          echo "======================================"

          sudo systemctl status xrdp --no-pager || true

          echo
          echo "PORT 3389:"
          sudo ss -lntp | grep ':3389' || true

      # ============================================================
      # TEST
      # ============================================================
      - name: Test XFCE
        run: |
          echo "======================================"
          echo "CHECK COMPONENT"
          echo "======================================"

          echo
          echo "xfce4-terminal:"
          command -v xfce4-terminal || true

          echo
          echo "xfconfd:"
          command -v xfconfd || true

          echo
          echo "dbus-run-session:"
          command -v dbus-run-session || true

          echo
          echo "startxfce4:"
          command -v startxfce4 || true

          echo
          echo "xfce4-session:"
          command -v xfce4-session || true

          echo
          echo "XRDP:"
          sudo systemctl is-active xrdp || true

          echo
          echo "PORT:"
          sudo ss -lntp | grep ':3389' || true

      # ============================================================
      # TAILSCALE
      # ============================================================
      - name: Install Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -e

          if [ -z "$TS_AUTHKEY" ]; then
            echo "ERROR: TS_AUTHKEY belum dibuat."
            exit 1
          fi

          echo "======================================"
          echo "INSTALL TAILSCALE"
          echo "======================================"

          curl -fsSL \
            https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="github-linux-rdp-${GITHUB_RUN_ID}"

          sleep 5

          echo
          echo "TAILSCALE STATUS:"
          sudo tailscale status

          echo
          echo "TAILSCALE IP:"
          sudo tailscale ip -4

      # ============================================================
      # RDP INFORMATION
      # ============================================================
      - name: Show RDP Information
        run: |
          TS_IP=$(sudo tailscale ip -4 | head -1)

          echo
          echo "=============================================="
          echo "             LINUX RDP READY"
          echo "=============================================="
          echo
          echo "ADDRESS : $TS_IP:3389"
          echo "USER    : rdpuser"
          echo "PASS    : RdpUser@12345"
          echo
          echo "SESSION : XFCE TERMINAL"
          echo
          echo "=============================================="

      # ============================================================
      # KEEP ALIVE
      # ============================================================
      - name: Keep RDP Alive
        run: |
          echo "=============================================="
          echo "              RDP AKTIF"
          echo "=============================================="

          TS_IP=$(sudo tailscale ip -4 | head -1)

          echo
          echo "RDP  : $TS_IP:3389"
          echo "USER : rdpuser"
          echo "PASS : RdpUser@12345"
          echo

          while true; do

            echo
            echo "----------------------------------------------"
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] STATUS"
            echo "----------------------------------------------"

            if sudo systemctl is-active --quiet xrdp; then
              echo "XRDP      : RUNNING"
            else
              echo "XRDP      : STOPPED"
              echo "Restarting XRDP..."

              sudo systemctl restart xrdp

              sleep 5
            fi

            if sudo ss -lnt | grep -q ':3389'; then
              echo "PORT 3389 : OPEN"
            else
              echo "PORT 3389 : CLOSED"
            fi

            if sudo tailscale status >/dev/null 2>&1; then
              echo "TAILSCALE  : OK"
            else
              echo "TAILSCALE  : ERROR"
            fi

            echo
            echo "RDP: $TS_IP:3389"

            sleep 60

          done
