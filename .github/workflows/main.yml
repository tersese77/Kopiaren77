name: Linux RDP

on:
  workflow_dispatch:

jobs:
  linux-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ============================================================
      # CHECK RUNNER
      # ============================================================
      - name: Check Runner
        run: |
          echo "========================================"
          echo "        LINUX XFCE RDP"
          echo "========================================"

          echo "OS:"
          cat /etc/os-release

          echo
          echo "CPU:"
          nproc

          echo
          echo "RAM:"
          free -h

          echo
          echo "DISK:"
          df -h /

      # ============================================================
      # INSTALL XFCE + XRDP
      # ============================================================
      - name: Install Desktop and XRDP
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-session \
            xfconf \
            xfdesktop4 \
            xfwm4 \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            dbus-user-session \
            xauth \
            policykit-1 \
            curl \
            wget

          echo
          echo "========================================"
          echo "XFCE + XRDP TERINSTALL"
          echo "========================================"

          xfce4-session --version || true
          xrdp --version || true

      # ============================================================
      # CREATE RDP USER
      # ============================================================
      - name: Create RDP User
        run: |
          set -e

          USERNAME="rdpuser"
          PASSWORD="RdpUser@12345"

          if id "$USERNAME" >/dev/null 2>&1; then
            echo "User sudah ada."
          else
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$USERNAME"
          fi

          echo "$USERNAME:$PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo "$USERNAME"

          # Pastikan home directory benar
          sudo mkdir -p "/home/$USERNAME"

          sudo chown \
            -R "$USERNAME:$USERNAME" \
            "/home/$USERNAME"

          echo
          echo "USER INFO:"
          id "$USERNAME"

      # ============================================================
      # CONFIGURE XFCE SESSION
      # ============================================================
      - name: Configure XFCE Session
        run: |
          set -e

          USERNAME="rdpuser"
          HOME_DIR="/home/$USERNAME"

          echo "========================================"
          echo "CONFIGURE XFCE"
          echo "========================================"

          # XFCE session untuk user RDP
          sudo -u "$USERNAME" bash -c "cat > '$HOME_DIR/.xsession' <<'EOF'
          #!/bin/bash

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce

          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/xfce4:/usr/local/share:/usr/share

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          exec dbus-launch --exit-with-session startxfce4
          EOF"

          sudo chmod +x "$HOME_DIR/.xsession"

          sudo chown \
            "$USERNAME:$USERNAME" \
            "$HOME_DIR/.xsession"

          # Buat config XFCE
          sudo -u "$USERNAME" mkdir -p \
            "$HOME_DIR/.config/xfce4"

          # Bersihkan session lama
          sudo -u "$USERNAME" rm -rf \
            "$HOME_DIR/.cache/sessions"

          echo
          echo ".xsession:"
          sudo cat "$HOME_DIR/.xsession"

      # ============================================================
      # CONFIGURE XRDP STARTUP
      # ============================================================
      - name: Configure XRDP
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURE XRDP"
          echo "========================================"

          # Backup konfigurasi asli
          if [ -f /etc/xrdp/startwm.sh ]; then
            sudo cp \
              /etc/xrdp/startwm.sh \
              /etc/xrdp/startwm.sh.backup
          fi

          # Startup XRDP khusus XFCE
          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce

          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/xfce4:/usr/local/share:/usr/share

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          if [ -r "$HOME/.profile" ]; then
              . "$HOME/.profile"
          fi

          exec dbus-launch --exit-with-session startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          # Tambahkan xrdp ke ssl-cert
          sudo adduser xrdp ssl-cert || true

          # Enable service
          sudo systemctl enable xrdp

          # Restart
          sudo systemctl restart xrdp

          sleep 5

          echo
          echo "========================================"
          echo "XRDP STATUS"
          echo "========================================"

          sudo systemctl status xrdp --no-pager || true

          echo
          echo "========================================"
          echo "PORT 3389"
          echo "========================================"

          sudo ss -lntp | grep ':3389' || true

          echo
          echo "========================================"
          echo "STARTWM"
          echo "========================================"

          sudo cat /etc/xrdp/startwm.sh

      # ============================================================
      # CHECK XFCE
      # ============================================================
      - name: Test XFCE
        run: |
          echo "========================================"
          echo "CHECK XFCE"
          echo "========================================"

          echo
          echo "XFCE binaries:"

          command -v startxfce4 || true
          command -v xfce4-session || true
          command -v xfconfd || true
          command -v dbus-launch || true

          echo
          echo "XFCE version:"
          xfce4-session --version || true

          echo
          echo "XRDP port:"
          sudo ss -lntp | grep ':3389' || true

      # ============================================================
      # INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -e

          if [ -z "$TS_AUTHKEY" ]; then
            echo "ERROR: TS_AUTHKEY belum dibuat di GitHub Secrets."
            exit 1
          fi

          echo "========================================"
          echo "INSTALL TAILSCALE"
          echo "========================================"

          curl -fsSL \
            https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="github-linux-rdp-${GITHUB_RUN_ID}"

          sleep 5

          echo
          echo "========================================"
          echo "TAILSCALE STATUS"
          echo "========================================"

          sudo tailscale status

          echo
          echo "========================================"
          echo "TAILSCALE IPV4"
          echo "========================================"

          sudo tailscale ip -4

      # ============================================================
      # SHOW RDP INFORMATION
      # ============================================================
      - name: Show RDP Information
        run: |
          TS_IP=$(sudo tailscale ip -4 | head -1)

          echo
          echo "=============================================="
          echo "           LINUX RDP BERHASIL"
          echo "=============================================="
          echo
          echo "RDP ADDRESS:"
          echo "$TS_IP:3389"
          echo
          echo "USERNAME:"
          echo "rdpuser"
          echo
          echo "PASSWORD:"
          echo "RdpUser@12345"
          echo
          echo "DESKTOP:"
          echo "XFCE4"
          echo
          echo "=============================================="
          echo
          echo "Gunakan aplikasi Microsoft Remote Desktop"
          echo "atau client RDP lainnya."
          echo
          echo "=============================================="

      # ============================================================
      # KEEP RDP ALIVE
      # ============================================================
      - name: Keep RDP Alive
        run: |
          echo "=============================================="
          echo "          RDP SEDANG BERJALAN"
          echo "=============================================="

          TS_IP=$(sudo tailscale ip -4 | head -1)

          echo
          echo "RDP  : $TS_IP:3389"
          echo "USER : rdpuser"
          echo "PASS : RdpUser@12345"
          echo

          while true; do

            echo
            echo "----------------------------------------------"
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] STATUS"
            echo "----------------------------------------------"

            # Cek XRDP
            if sudo systemctl is-active --quiet xrdp; then
              echo "XRDP : RUNNING"
            else
              echo "XRDP : STOPPED"
              echo "Restart XRDP..."

              sudo systemctl restart xrdp

              sleep 5

              if sudo systemctl is-active --quiet xrdp; then
                echo "XRDP berhasil direstart."
              else
                echo "WARNING: XRDP gagal restart."
              fi
            fi

            # Cek port
            if sudo ss -lnt | grep -q ':3389'; then
              echo "PORT : 3389 OPEN"
            else
              echo "PORT : 3389 CLOSED"
            fi

            # Cek Tailscale
            if sudo tailscale status >/dev/null 2>&1; then
              echo "TAILSCALE : OK"
            else
              echo "TAILSCALE : ERROR"
            fi

            echo
            echo "RDP : $TS_IP:3389"

            sleep 60

          done
