name: Windows 10 RDP - QEMU KVM

on:
  workflow_dispatch:

jobs:
  windows10:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ============================================================
      # CHECK RUNNER
      # ============================================================
      - name: Check Runner
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "RUNNER INFORMATION"
          echo "========================================"

          echo "CPU:"
          nproc

          echo
          echo "RAM:"
          free -h

          echo
          echo "KVM:"
          if [ -e /dev/kvm ]; then
            echo "/dev/kvm tersedia"
            ls -lh /dev/kvm
          else
            echo "ERROR: /dev/kvm tidak tersedia."
            echo "Runner ini tidak mendukung KVM."
            exit 1
          fi

      # ============================================================
      # INSTALL PACKAGES
      # ============================================================
      - name: Install QEMU and Tools
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            p7zip-full \
            wget \
            curl \
            genisoimage

          echo
          echo "QEMU:"
          qemu-system-x86_64 --version

          echo
          echo "7-Zip:"
          7z

      # ============================================================
      # INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -e

          if [ -z "$TS_AUTHKEY" ]; then
            echo "ERROR: TS_AUTHKEY belum dibuat."
            exit 1
          fi

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="github-windows10-${GITHUB_RUN_ID}" \
            --accept-routes

          echo
          echo "========================================"
          echo "TAILSCALE"
          echo "========================================"

          tailscale status
          tailscale ip -4

      # ============================================================
      # DOWNLOAD WINDOWS 10 7Z
      # ============================================================
      - name: Download Windows 10 Archive
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/windows10"

          URL="https://od.meong.club/kyccn/TEMP/sof/win10.enterprise.LTSC.2019.x86.kyhAa.7z"

          echo "========================================"
          echo "DOWNLOADING WINDOWS 10"
          echo "========================================"

          echo "URL:"
          echo "$URL"

          wget \
            --progress=dot:giga \
            --continue \
            -O "$HOME/windows10/windows10.7z" \
            "$URL"

          echo
          echo "Downloaded file:"
          ls -lh "$HOME/windows10/windows10.7z"

      # ============================================================
      # EXTRACT 7Z
      # ============================================================
      - name: Extract Windows 10 Archive
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/windows10/extracted"

          echo "========================================"
          echo "EXTRACTING 7Z"
          echo "========================================"

          7z x \
            "$HOME/windows10/windows10.7z" \
            -o"$HOME/windows10/extracted" \
            -y

          echo
          echo "Extracted files:"
          find "$HOME/windows10/extracted" \
            -type f \
            -printf "%p  %k KB\n" | head -100

      # ============================================================
      # FIND ISO
      # ============================================================
      - name: Find Windows ISO
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING WINDOWS ISO"
          echo "========================================"

          ISO=$(find "$HOME/windows10/extracted" \
            -type f \
            \( -iname "*.iso" -o -iname "*.ISO" \) \
            | head -1)

          if [ -z "$ISO" ]; then
            echo
            echo "ERROR: ISO Windows tidak ditemukan."
            echo
            echo "Isi archive:"
            find "$HOME/windows10/extracted" -type f
            exit 1
          fi

          echo "ISO ditemukan:"
          echo "$ISO"

          cp "$ISO" "$HOME/windows10/Win10.iso"

          echo
          echo "ISO:"
          ls -lh "$HOME/windows10/Win10.iso"

      # ============================================================
      # CREATE WINDOWS DISK
      # ============================================================
      - name: Create Windows Disk
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CREATING WINDOWS DISK"
          echo "========================================"

          qemu-img create \
            -f qcow2 \
            "$HOME/windows10/windows10.qcow2" \
            40G

          qemu-img info "$HOME/windows10/windows10.qcow2"

      # ============================================================
      # CREATE AUTO UNATTEND
      # ============================================================
      - name: Create Windows Auto Install
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/windows10/autounattend"

          cat > "$HOME/windows10/autounattend/autounattend.xml" <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<unattend xmlns="urn:schemas-microsoft-com:unattend">

  <!-- ==========================================================
       WINDOWS PE
       ========================================================== -->

  <settings pass="windowsPE">

    <component
      name="Microsoft-Windows-International-Core-WinPE"
      processorArchitecture="amd64"
      publicKeyToken="31bf3856ad364e35"
      language="neutral"
      versionScope="nonSxS">

      <SetupUILanguage>
        <UILanguage>en-US</UILanguage>
      </SetupUILanguage>

      <InputLocale>en-US</InputLocale>
      <SystemLocale>en-US</SystemLocale>
      <UILanguage>en-US</UILanguage>
      <UserLocale>en-US</UserLocale>

    </component>

    <component
      name="Microsoft-Windows-Setup"
      processorArchitecture="amd64"
      publicKeyToken="31bf3856ad364e35"
      language="neutral"
      versionScope="nonSxS">

      <DiskConfiguration>

        <Disk wcm:action="add">

          <DiskID>0</DiskID>

          <WillWipeDisk>true</WillWipeDisk>

          <CreatePartitions>

            <CreatePartition wcm:action="add">
              <Order>1</Order>
              <Size>100</Size>
              <Type>EFI</Type>
            </CreatePartition>

            <CreatePartition wcm:action="add">
              <Order>2</Order>
              <Size>16</Size>
              <Type>MSR</Type>
            </CreatePartition>

            <CreatePartition wcm:action="add">
              <Order>3</Order>
              <Extend>true</Extend>
              <Type>Primary</Type>
            </CreatePartition>

          </CreatePartitions>

          <ModifyPartitions>

            <ModifyPartition wcm:action="add">
              <Order>1</Order>
              <PartitionID>1</PartitionID>
              <Format>FAT32</Format>
              <Label>System</Label>
            </ModifyPartition>

            <ModifyPartition wcm:action="add">
              <Order>2</Order>
              <PartitionID>2</PartitionID>
            </ModifyPartition>

            <ModifyPartition wcm:action="add">
              <Order>3</Order>
              <PartitionID>3</PartitionID>
              <Format>NTFS</Format>
              <Label>Windows</Label>
              <Letter>C</Letter>
            </ModifyPartition>

          </ModifyPartitions>

        </Disk>

        <WillShowUI>OnError</WillShowUI>

      </DiskConfiguration>

      <ImageInstall>

        <OSImage>

          <InstallFrom>

            <MetaData wcm:action="add">
              <Key>/IMAGE/INDEX</Key>
              <Value>1</Value>
            </MetaData>

          </InstallFrom>

          <InstallTo>
            <DiskID>0</DiskID>
            <PartitionID>3</PartitionID>
          </InstallTo>

          <WillShowUI>OnError</WillShowUI>

        </OSImage>

      </ImageInstall>

      <UserData>

        <AcceptEula>true</AcceptEula>

      </UserData>

    </component>

  </settings>


  <!-- ==========================================================
       OOBE
       ========================================================== -->

  <settings pass="oobeSystem">

    <component
      name="Microsoft-Windows-International-Core"
      processorArchitecture="amd64"
      publicKeyToken="31bf3856ad364e35"
      language="neutral"
      versionScope="nonSxS">

      <InputLocale>en-US</InputLocale>
      <SystemLocale>en-US</SystemLocale>
      <UILanguage>en-US</UILanguage>
      <UserLocale>en-US</UserLocale>

    </component>


    <component
      name="Microsoft-Windows-Shell-Setup"
      processorArchitecture="amd64"
      publicKeyToken="31bf3856ad364e35"
      language="neutral"
      versionScope="nonSxS">


      <OOBE>

        <HideEULAPage>true</HideEULAPage>

        <HideLocalAccountScreen>true</HideLocalAccountScreen>

        <HideOEMRegistrationScreen>true</HideOEMRegistrationScreen>

        <HideOnlineAccountScreens>true</HideOnlineAccountScreens>

        <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>

        <ProtectYourPC>3</ProtectYourPC>

      </OOBE>


      <!-- ======================================================
           RDP USER
           ====================================================== -->

      <UserAccounts>

        <LocalAccounts>

          <LocalAccount wcm:action="add">

            <Name>rdpuser</Name>

            <DisplayName>RDP User</DisplayName>

            <Description>Windows RDP User</Description>

            <Group>Administrators</Group>

            <Password>

              <Value>RdpUser@12345</Value>

              <PlainText>true</PlainText>

            </Password>

          </LocalAccount>

        </LocalAccounts>

      </UserAccounts>


      <RegisteredOwner>RDP</RegisteredOwner>

      <RegisteredOrganization>Windows</RegisteredOrganization>

      <TimeZone>SE Asia Standard Time</TimeZone>


      <!-- ======================================================
           ENABLE RDP
           ====================================================== -->

      <FirstLogonCommands>

        <SynchronousCommand wcm:action="add">

          <Order>1</Order>

          <CommandLine>
            powershell.exe -ExecutionPolicy Bypass -Command "Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0"
          </CommandLine>

        </SynchronousCommand>


        <SynchronousCommand wcm:action="add">

          <Order>2</Order>

          <CommandLine>
            powershell.exe -ExecutionPolicy Bypass -Command "Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'"
          </CommandLine>

        </SynchronousCommand>


        <SynchronousCommand wcm:action="add">

          <Order>3</Order>

          <CommandLine>
            powershell.exe -ExecutionPolicy Bypass -Command "Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0"
          </CommandLine>

        </SynchronousCommand>

      </FirstLogonCommands>

    </component>

  </settings>

</unattend>
EOF

          echo "Autounattend dibuat."

      # ============================================================
      # CREATE AUTOUNATTEND ISO
      # ============================================================
      - name: Create AutoUnattend ISO
        shell: bash
        run: |
          set -e

          genisoimage \
            -o "$HOME/windows10/autounattend.iso" \
            -J \
            -R \
            "$HOME/windows10/autounattend"

          ls -lh "$HOME/windows10/autounattend.iso"

      # ============================================================
      # START QEMU
      # ============================================================
      - name: Start Windows 10 VM
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/windows10/logs"

          echo "========================================"
          echo "START WINDOWS 10"
          echo "========================================"

          sudo qemu-system-x86_64 \
            -enable-kvm \
            -machine q35,accel=kvm \
            -cpu host \
            -smp 2 \
            -m 5G \
            -drive file="$HOME/windows10/windows10.qcow2",if=virtio,format=qcow2 \
            -drive file="$HOME/windows10/Win10.iso",media=cdrom,readonly=on \
            -drive file="$HOME/windows10/autounattend.iso",media=cdrom,readonly=on \
            -boot order=d \
            -bios /usr/share/OVMF/OVMF_CODE_4M.fd \
            -netdev user,id=net0,hostfwd=tcp:0.0.0.0:3389-:3389 \
            -device virtio-net-pci,netdev=net0 \
            -vga virtio \
            -display none \
            -daemonize \
            -pidfile "$HOME/windows10/qemu.pid" \
            -D "$HOME/windows10/logs/qemu.log"

          sleep 10

          if [ ! -f "$HOME/windows10/qemu.pid" ]; then
            echo "QEMU gagal start."
            cat "$HOME/windows10/logs/qemu.log" || true
            exit 1
          fi

          echo "QEMU berhasil dijalankan."
          cat "$HOME/windows10/qemu.pid"

      # ============================================================
      # WAIT FOR WINDOWS
      # ============================================================
      - name: Wait For Windows
        shell: bash
        run: |
          set -e

          echo "Menunggu Windows 10 boot/install..."

          for i in $(seq 1 40); do

            if ! sudo kill -0 "$(cat "$HOME/windows10/qemu.pid")" 2>/dev/null; then
              echo "QEMU berhenti."

              echo
              echo "===== QEMU LOG ====="

              tail -200 "$HOME/windows10/logs/qemu.log" || true

              exit 1
            fi

            echo "Windows masih booting... $i/40"

            sleep 30

          done

      # ============================================================
      # CONNECTION INFORMATION
      # ============================================================
      - name: Show RDP Information
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo "           WINDOWS 10 RDP READY"
          echo "=================================================="
          echo

          TS_IP=$(tailscale ip -4 | head -1)

          echo "Tailscale IP:"
          echo "$TS_IP"

          echo
          echo "RDP ADDRESS:"
          echo "$TS_IP:3389"

          echo
          echo "USERNAME:"
          echo "rdpuser"

          echo
          echo "PASSWORD:"
          echo "RdpUser@12345"

          echo
          echo "=================================================="
          echo "TAILSCALE STATUS"
          echo "=================================================="

          tailscale status || true

          echo
          echo "=================================================="
          echo "QEMU STATUS"
          echo "=================================================="

          ps aux | grep qemu-system-x86_64 | grep -v grep || true

      # ============================================================
      # KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep Windows Running
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo "WINDOWS 10 SEDANG BERJALAN"
          echo "=================================================="
          echo
          echo "RDP : $(tailscale ip -4 | head -1):3389"
          echo "USER: rdpuser"
          echo "PASS: RdpUser@12345"
          echo

          while true; do

            if ! sudo kill -0 "$(cat "$HOME/windows10/qemu.pid")" 2>/dev/null; then

              echo
              echo "Windows/QEMU berhenti!"
              echo

              echo "===== QEMU LOG ====="

              tail -200 "$HOME/windows10/logs/qemu.log" || true

              exit 1

            fi

            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Windows masih berjalan"

            sleep 60

          done
