name: Windows RDP Tailscale

on:
workflow_dispatch:

jobs:
windows-rdp:
runs-on: windows-latest
timeout-minutes: 350

steps:

  # ============================================================
  # 1. ENABLE REMOTE DESKTOP
  # ============================================================
  - name: Enable Remote Desktop
    shell: powershell
    run: |
      Write-Host "Enabling Remote Desktop..."

      Set-ItemProperty `
        -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
        -Name "fDenyTSConnections" `
        -Value 0 `
        -Force

      Set-ItemProperty `
        -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
        -Name "UserAuthentication" `
        -Value 0 `
        -Force

      Set-ItemProperty `
        -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
        -Name "SecurityLayer" `
        -Value 0 `
        -Force

      netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

      netsh advfirewall firewall add rule `
        name="RDP-Tailscale" `
        dir=in `
        action=allow `
        protocol=TCP `
        localport=3389

      Set-Service -Name TermService -StartupType Automatic

      Restart-Service -Name TermService -Force

      Write-Host "Remote Desktop enabled."

  # ============================================================
  # 2. CREATE RDP USER
  # ============================================================
  - name: Create RDP User
    shell: powershell
    run: |
      Write-Host "Creating RDP user..."

      $username = "RDP"

      $upper   = [char[]]"ABCDEFGHIJKLMNOPQRSTUVWXYZ"
      $lower   = [char[]]"abcdefghijklmnopqrstuvwxyz"
      $number  = [char[]]"0123456789"
      $special = [char[]]"!@#$%^&*"

      $passwordChars = @()

      $passwordChars += $upper   | Get-Random -Count 4
      $passwordChars += $lower   | Get-Random -Count 4
      $passwordChars += $number  | Get-Random -Count 4
      $passwordChars += $special | Get-Random -Count 4

      $password = -join ($passwordChars | Sort-Object { Get-Random })

      $securePassword = ConvertTo-SecureString `
        $password `
        -AsPlainText `
        -Force

      if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
          Remove-LocalUser -Name $username
      }

      New-LocalUser `
        -Name $username `
        -Password $securePassword `
        -Description "GitHub Actions RDP User" `
        -AccountNeverExpires `
        -PasswordNeverExpires

      Add-LocalGroupMember `
        -Group "Administrators" `
        -Member $username

      Add-LocalGroupMember `
        -Group "Remote Desktop Users" `
        -Member $username

      "RDP_USERNAME=$username" | Out-File `
        -FilePath $env:GITHUB_ENV `
        -Append

      "RDP_PASSWORD=$password" | Out-File `
        -FilePath $env:GITHUB_ENV `
        -Append

      Write-Host "RDP user created successfully."

  # ============================================================
  # 3. INSTALL TAILSCALE
  # ============================================================
  - name: Install Tailscale
    shell: powershell
    run: |
      Write-Host "Installing Tailscale..."

      $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"

      $installer = "$env:TEMP\tailscale.msi"

      Invoke-WebRequest `
        -Uri $url `
        -OutFile $installer

      Start-Process `
        -FilePath "msiexec.exe" `
        -ArgumentList "/i `"$installer`" /quiet /norestart" `
        -Wait

      Remove-Item $installer -Force -ErrorAction SilentlyContinue

      Write-Host "Tailscale installation complete."

  # ============================================================
  # 4. CONNECT TAILSCALE USING TS_AUTHKEY
  # ============================================================
  - name: Connect Tailscale
    shell: powershell
    env:
      TS_AUTH_KEY: ${{ secrets.TS_AUTHKEY }}
    run: |
      Write-Host "Connecting to Tailscale..."

      $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

      if (-not (Test-Path $tailscale)) {
          Write-Error "Tailscale executable not found."
          exit 1
      }

      if (-not $env:TS_AUTH_KEY) {
          Write-Error "GitHub Secret TS_AUTHKEY is missing."
          exit 1
      }

      & $tailscale up `
        --authkey="$env:TS_AUTH_KEY" `
        --hostname="github-rdp-$env:GITHUB_RUN_ID" `
        --unattended=true

      Start-Sleep -Seconds 10

      Write-Host "Tailscale status:"
      & $tailscale status

  # ============================================================
  # 5. GET TAILSCALE IP
  # ============================================================
  - name: Get Tailscale IP
    shell: powershell
    run: |
      $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

      $tsIP = $null

      for ($i = 1; $i -le 20; $i++) {

          Write-Host "Waiting for Tailscale IP... attempt $i/20"

          $tsIP = (& $tailscale ip -4 2>$null | Select-Object -First 1).Trim()

          if ($tsIP -and $tsIP -match "^100\.") {
              break
          }

          Start-Sleep -Seconds 3
      }

      if (-not $tsIP) {
          Write-Error "Tailscale IPv4 address was not assigned."
          exit 1
      }

      "TAILSCALE_IP=$tsIP" | Out-File `
        -FilePath $env:GITHUB_ENV `
        -Append

      Write-Host ""
      Write-Host "=========================================="
      Write-Host "        WINDOWS RDP IS READY"
      Write-Host "=========================================="
      Write-Host "Tailscale IP : $tsIP"
      Write-Host "RDP Port     : 3389"
      Write-Host "Username     : $env:RDP_USERNAME"
      Write-Host "Password     : $env:RDP_PASSWORD"
      Write-Host "=========================================="

  # ============================================================
  # 6. VERIFY RDP SERVICE
  # ============================================================
  - name: Verify RDP Service
    shell: powershell
    run: |
      Write-Host "Checking Remote Desktop service..."

      $service = Get-Service -Name TermService

      Write-Host "Service status: $($service.Status)"

      if ($service.Status -ne "Running") {
          Start-Service -Name TermService
          Start-Sleep -Seconds 3
      }

      $port = Get-NetTCPConnection `
        -LocalPort 3389 `
        -State Listen `
        -ErrorAction SilentlyContinue

      if ($port) {
          Write-Host "RDP port 3389 is listening."
      }
      else {
          Write-Warning "Port 3389 is not detected yet."
      }

  # ============================================================
  # 7. DISPLAY CONNECTION INFORMATION
  # ============================================================
  - name: Show RDP Information
    shell: powershell
    run: |
      Write-Host ""
      Write-Host "================================================"
      Write-Host "             WINDOWS DESKTOP READY"
      Write-Host "================================================"
      Write-Host ""
      Write-Host "RDP Address : $env:TAILSCALE_IP"
      Write-Host "RDP Port    : 3389"
      Write-Host "Username    : $env:RDP_USERNAME"
      Write-Host "Password    : $env:RDP_PASSWORD"
      Write-Host ""
      Write-Host "Open Windows Remote Desktop:"
      Write-Host "mstsc.exe"
      Write-Host ""
      Write-Host "Connect to:"
      Write-Host "$env:TAILSCALE_IP"
      Write-Host ""
      Write-Host "================================================"

  # ============================================================
  # 8. KEEP RUNNER ALIVE
  # ============================================================
  - name: Keep RDP Alive
    shell: powershell
    run: |
      Write-Host ""
      Write-Host "=============================================="
      Write-Host "       RDP SESSION IS ACTIVE"
      Write-Host "=============================================="
      Write-Host "Do not cancel this workflow while connected."
      Write-Host ""

      while ($true) {

          $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

          $rdp = Get-Service `
            -Name TermService `
            -ErrorAction SilentlyContinue

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          $tsIP = (& $tailscale ip -4 2>$null | Select-Object -First 1).Trim()

          Write-Host "[$time] RDP: $($rdp.Status) | Tailscale: $tsIP"

          if ($rdp.Status -ne "Running") {
              Write-Host "Restarting Remote Desktop service..."
              Start-Service -Name TermService
          }

          Start-Sleep -Seconds 60
      }
