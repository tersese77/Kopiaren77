name: Linux RDP + Wine + MT5

on:
  workflow_dispatch:

jobs:
  mt5-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ============================================================
      # CHECK RUNNER
      # ============================================================
      - name: Check Runner
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "LINUX RDP + WINE + MT5"
          echo "=========================================="

          echo
          echo "OS:"
          lsb_release -a || true

          echo
          echo "CPU:"
          nproc

          echo
          echo "RAM:"
          free -h

          echo
          echo "DISK:"
          df -h /

      # ============================================================
      # INSTALL XFCE + XRDP
      # ============================================================
      - name: Install XFCE and XRDP
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            xauth \
            wget \
            curl \
            unzip \
            cabextract \
            software-properties-common

          echo
          echo "XFCE:"
          xfce4-session --version || true

          echo
          echo "XRDP:"
          xrdp --version || true

      # ============================================================
      # CREATE RDP USER
      # ============================================================
      - name: Create RDP User
        shell: bash
        run: |
          set -e

          USERNAME="rdpuser"
          PASSWORD="RdpUser@12345"

          if id "$USERNAME" >/dev/null 2>&1; then
            echo "User sudah ada."
          else
            sudo useradd \
              -m \
              -s /bin/bash \
              "$USERNAME"
          fi

          echo "$USERNAME:$PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo "$USERNAME"

          sudo -u "$USERNAME" bash -c \
            'echo "startxfce4" > ~/.xsession'

          sudo chmod +x "/home/$USERNAME/.xsession"

          sudo chown "$USERNAME:$USERNAME" \
            "/home/$USERNAME/.xsession"

          echo
          echo "RDP USER:"
          id "$USERNAME"

      # ============================================================
      # CONFIGURE XRDP
      # ============================================================
      - name: Configure XRDP
        shell: bash
        run: |
          set -e

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          sleep 5

          echo
          echo "XRDP STATUS:"
          sudo systemctl status xrdp --no-pager || true

          echo
          echo "PORT:"
          sudo ss -lntp | grep ':3389' || true

      # ============================================================
      # INSTALL WINE
      # ============================================================
      - name: Install Wine
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL WINE"
          echo "=========================================="

          sudo dpkg --add-architecture i386

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            wine64 \
            wine32 \
            winbind \
            xvfb \
            x11-utils

          echo
          echo "WINE VERSION:"
          wine --version

      # ============================================================
      # CREATE WINE PREFIX
      # ============================================================
      - name: Configure Wine
        shell: bash
        run: |
          set -e

          USERNAME="rdpuser"

          sudo -u "$USERNAME" mkdir -p \
            "/home/$USERNAME/.wine-mt5"

          sudo -u "$USERNAME" bash -c '
            export WINEPREFIX="$HOME/.wine-mt5"
            export WINEARCH=win64

            wineboot --init
          '

          echo "Wine prefix berhasil dibuat."

      # ============================================================
      # INSTALL WINETRICKS DEPENDENCIES
      # ============================================================
      - name: Install Wine Dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get install -y winetricks

          USERNAME="rdpuser"

          sudo -u "$USERNAME" bash -c '
            export WINEPREFIX="$HOME/.wine-mt5"

            winetricks -q \
              corefonts \
              vcrun2019 \
              msxml6 \
              gdiplus \
              riched20 \
              riched30
          ' || true

          echo "Wine dependencies selesai."

      # ============================================================
      # DOWNLOAD MT5
      # ============================================================
      - name: Download MT5
        shell: bash
        run: |
          set -e

          USERNAME="rdpuser"

          mkdir -p "/home/$USERNAME/mt5"

          sudo chown -R "$USERNAME:$USERNAME" \
            "/home/$USERNAME/mt5"

          echo "=========================================="
          echo "DOWNLOAD MT5"
          echo "=========================================="

          sudo -u "$USERNAME" wget \
            -O "/home/$USERNAME/mt5/mt5setup.exe" \
            "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

          ls -lh "/home/$USERNAME/mt5/mt5setup.exe"

      # ============================================================
      # INSTALL MT5
      # ============================================================
      - name: Install MT5
        shell: bash
        run: |
          set -e

          USERNAME="rdpuser"

          sudo -u "$USERNAME" bash -c '
            export WINEPREFIX="$HOME/.wine-mt5"

            mkdir -p "$HOME/mt5"

            wine "$HOME/mt5/mt5setup.exe" \
              /auto
          '

          echo "Menunggu installer MT5..."

          sleep 30

          echo
          echo "MT5 FILES:"

          find "/home/$USERNAME/.wine-mt5/drive_c" \
            -iname "terminal64.exe" \
            -o -iname "terminal.exe" \
            2>/dev/null | head -20

      # ============================================================
      # FIND MT5 TERMINAL
      # ============================================================
      - name: Find MT5 Terminal
        shell: bash
        run: |
          set -e

          USERNAME="rdpuser"

          MT5=$(find "/home/$USERNAME/.wine-mt5/drive_c" \
            -type f \
            \( \
              -iname "terminal64.exe" \
              -o \
              -iname "terminal.exe" \
            \) \
            2>/dev/null | head -1)

          if [ -z "$MT5" ]; then
            echo "MT5 terminal belum ditemukan."

            echo
            echo "Isi drive C:"
            find "/home/$USERNAME/.wine-mt5/drive_c" \
              -maxdepth 5 \
              -type f \
              2>/dev/null | head -100

            exit 1
          fi

          echo "MT5 ditemukan:"
          echo "$MT5"

          echo "$MT5" > "/home/$USERNAME/mt5_path.txt"

          sudo chown "$USERNAME:$USERNAME" \
            "/home/$USERNAME/mt5_path.txt"

      # ============================================================
      # CREATE MT5 START SCRIPT
      # ============================================================
      - name: Create MT5 Start Script
        shell: bash
        run: |
          set -e

          USERNAME="rdpuser"

          sudo -u "$USERNAME" bash -c 'cat > "$HOME/start-mt5.sh" <<'\''EOF'\''
          #!/bin/bash

          export WINEPREFIX="$HOME/.wine-mt5"

          MT5_PATH="$(cat "$HOME/mt5_path.txt")"

          if [ -z "$MT5_PATH" ]; then
            echo "MT5 path tidak ditemukan."
            exit 1
          fi

          echo "Starting MT5..."
          echo "Path: $MT5_PATH"

          wine "$MT5_PATH" /portable
          EOF
          '

          sudo chmod +x \
            "/home/$USERNAME/start-mt5.sh"

          sudo chown "$USERNAME:$USERNAME" \
            "/home/$USERNAME/start-mt5.sh"

      # ============================================================
      # CREATE DESKTOP SHORTCUT
      # ============================================================
      - name: Create MT5 Desktop Shortcut
        shell: bash
        run: |
          set -e

          USERNAME="rdpuser"

          sudo -u "$USERNAME" mkdir -p \
            "/home/$USERNAME/Desktop"

          sudo -u "$USERNAME" bash -c 'cat > "$HOME/Desktop/MetaTrader5.desktop" <<'\''EOF'\''
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=MetaTrader 5
          Comment=MetaTrader 5
          Exec=/home/rdpuser/start-mt5.sh
          Terminal=false
          Categories=Finance;
          EOF
          '

          sudo chmod +x \
            "/home/$USERNAME/Desktop/MetaTrader5.desktop"

          sudo chown -R "$USERNAME:$USERNAME" \
            "/home/$USERNAME/Desktop"

      # ============================================================
      # INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL TAILSCALE"
          echo "=========================================="

          if [ -z "$TS_AUTHKEY" ]; then
            echo "ERROR: TS_AUTHKEY belum dibuat."
            exit 1
          fi

          curl -fsSL \
            https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="github-mt5-rdp-${GITHUB_RUN_ID}"

          sleep 5

          echo
          echo "TAILSCALE STATUS:"
          sudo tailscale status

          echo
          echo "TAILSCALE IP:"
          sudo tailscale ip -4

      # ============================================================
      # START MT5
      # ============================================================
      - name: Start MT5
        shell: bash
        run: |
          set -e

          USERNAME="rdpuser"

          echo "=========================================="
          echo "START MT5"
          echo "=========================================="

          sudo -u "$USERNAME" \
            nohup \
            "/home/$USERNAME/start-mt5.sh" \
            > "/home/$USERNAME/mt5.log" \
            2>&1 &

          sleep 15

          echo
          echo "MT5 PROCESS:"
          ps aux | grep -i '[w]ine' || true

          echo
          echo "MT5 LOG:"
          tail -100 "/home/$USERNAME/mt5.log" || true

      # ============================================================
      # SHOW INFORMATION
      # ============================================================
      - name: Show Connection Information
        shell: bash
        run: |
          TS_IP=$(sudo tailscale ip -4 | head -1)

          echo
          echo "=================================================="
          echo "              LINUX MT5 RDP READY"
          echo "=================================================="

          echo
          echo "RDP ADDRESS:"
          echo "$TS_IP:3389"

          echo
          echo "USERNAME:"
          echo "rdpuser"

          echo
          echo "PASSWORD:"
          echo "RdpUser@12345"

          echo
          echo "DESKTOP:"
          echo "XFCE4"

          echo
          echo "MT5:"
          echo "MetaTrader 5"

          echo
          echo "=================================================="
          echo "TAILSCALE"
          echo "=================================================="

          sudo tailscale status || true

          echo
          echo "=================================================="
          echo "XRDP"
          echo "=================================================="

          sudo systemctl status xrdp \
            --no-pager || true

      # ============================================================
      # KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep MT5 and RDP Running
        shell: bash
        run: |
          set -e

          USERNAME="rdpuser"

          echo
          echo "=================================================="
          echo "MT5 + LINUX RDP SEDANG BERJALAN"
          echo "=================================================="

          TS_IP=$(sudo tailscale ip -4 | head -1)

          echo
          echo "RDP  : $TS_IP:3389"
          echo "USER : rdpuser"
          echo "PASS : RdpUser@12345"
          echo

          while true; do

            if ! sudo systemctl is-active \
              --quiet xrdp; then

              echo "XRDP berhenti."
              echo "Restart XRDP..."

              sudo systemctl restart xrdp

            fi

            if ! pgrep -f \
              "terminal64.exe|terminal.exe" \
              >/dev/null 2>&1; then

              echo "MT5 tidak terdeteksi."
              echo "Mencoba menjalankan kembali..."

              sudo -u "$USERNAME" \
                nohup \
                "/home/$USERNAME/start-mt5.sh" \
                >> "/home/$USERNAME/mt5.log" \
                2>&1 &

            fi

            echo
            echo "[$(date '+%Y-%m-%d %H:%M:%S')]"

            echo "XRDP:"
            sudo systemctl is-active xrdp || true

            echo "MT5:"
            pgrep -af \
              "terminal64.exe|terminal.exe" \
              || true

            echo "Tailscale:"
            sudo tailscale ip -4 || true

            sleep 60

          done
