name: Linux RDP XFCE

on:
  workflow_dispatch:

jobs:
  linux-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ============================================================
      # CHECK SERVER
      # ============================================================
      - name: Check Server
        run: |
          echo "=============================================="
          echo "             LINUX RDP XFCE"
          echo "=============================================="

          echo
          echo "OS:"
          cat /etc/os-release

          echo
          echo "CPU:"
          nproc

          echo
          echo "RAM:"
          free -h

          echo
          echo "DISK:"
          df -h /

      # ============================================================
      # INSTALL XFCE + XRDP + DBUS
      # ============================================================
      - name: Install XFCE XRDP DBUS
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-session \
            xfconf \
            xfdesktop4 \
            xfwm4 \
            xfce4-terminal \
            xrdp \
            xorgxrdp \
            dbus \
            dbus-x11 \
            dbus-user-session \
            dbus-daemon \
            xauth \
            policykit-1 \
            sudo \
            curl \
            wget

          echo
          echo "=============================================="
          echo "XFCE COMPONENTS"
          echo "=============================================="

          command -v startxfce4
          command -v xfce4-session
          command -v xfconfd
          command -v dbus-run-session
          command -v xrdp

      # ============================================================
      # CREATE RDP USER
      # ============================================================
      - name: Create RDP User
        run: |
          set -e

          USERNAME="rdpuser"
          PASSWORD="RdpUser@12345"

          if id "$USERNAME" >/dev/null 2>&1; then
            echo "User sudah ada."
          else
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$USERNAME"
          fi

          echo "$USERNAME:$PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo "$USERNAME"

          HOME_DIR="/home/$USERNAME"

          sudo mkdir -p "$HOME_DIR/.config/xfce4"
          sudo mkdir -p "$HOME_DIR/.cache/sessions"

          sudo chown -R \
            "$USERNAME:$USERNAME" \
            "$HOME_DIR"

          echo
          echo "RDP USER:"
          id "$USERNAME"

      # ============================================================
      # CLEAN OLD XFCE SESSION
      # ============================================================
      - name: Clean XFCE Session
        run: |
          set -e

          USERNAME="rdpuser"
          HOME_DIR="/home/$USERNAME"

          sudo -u "$USERNAME" rm -rf \
            "$HOME_DIR/.cache/sessions"

          sudo -u "$USERNAME" rm -rf \
            "$HOME_DIR/.config/xfce4/xfconf"

          sudo -u "$USERNAME" mkdir -p \
            "$HOME_DIR/.config/xfce4/xfconf/xfce-perchannel-xml"

          sudo chown -R \
            "$USERNAME:$USERNAME" \
            "$HOME_DIR/.config"

      # ============================================================
      # XFCE SESSION
      # ============================================================
      - name: Configure XFCE Session
        run: |
          set -e

          USERNAME="rdpuser"
          HOME_DIR="/home/$USERNAME"

          sudo tee "$HOME_DIR/.xsession" > /dev/null <<'EOF'
          #!/bin/sh

          # --------------------------------------------------------
          # LANGUAGE
          # --------------------------------------------------------
          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          # --------------------------------------------------------
          # XFCE
          # --------------------------------------------------------
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce

          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export XDG_DATA_DIRS=/usr/local/share:/usr/share

          # --------------------------------------------------------
          # REMOVE POSSIBLY BROKEN DBUS VARIABLES
          # --------------------------------------------------------
          unset DBUS_SESSION_BUS_ADDRESS
          unset DBUS_STARTER_BUS_TYPE
          unset DBUS_STARTER_ADDRESS

          # --------------------------------------------------------
          # START A FRESH DBUS SESSION
          # --------------------------------------------------------
          exec dbus-run-session -- sh -c '
              xfconfd >/tmp/xfconfd-rdp.log 2>&1 &
              sleep 1
              exec startxfce4
          '
          EOF

          sudo chmod +x "$HOME_DIR/.xsession"

          sudo chown \
            "$USERNAME:$USERNAME" \
            "$HOME_DIR/.xsession"

          echo
          echo "=============================================="
          echo "XSESSION"
          echo "=============================================="

          sudo cat "$HOME_DIR/.xsession"

      # ============================================================
      # CONFIGURE XRDP
      # ============================================================
      - name: Configure XRDP
        run: |
          set -e

          echo "=============================================="
          echo "CONFIGURE XRDP"
          echo "=============================================="

          if [ -f /etc/xrdp/startwm.sh ]; then
            sudo cp \
              /etc/xrdp/startwm.sh \
              /etc/xrdp/startwm.sh.backup
          fi

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce

          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export XDG_DATA_DIRS=/usr/local/share:/usr/share

          unset DBUS_SESSION_BUS_ADDRESS
          unset DBUS_STARTER_BUS_TYPE
          unset DBUS_STARTER_ADDRESS

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          if [ -r "$HOME/.profile" ]; then
              . "$HOME/.profile"
          fi

          exec "$HOME/.xsession"
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          sudo adduser xrdp ssl-cert || true

          sudo systemctl enable xrdp

          sudo systemctl restart xrdp

          sleep 5

          echo
          echo "XRDP SERVICE:"
          sudo systemctl is-active xrdp

          echo
          echo "XRDP PORT:"
          sudo ss -lntp | grep ':3389' || true

      # ============================================================
      # CHECK CONFIGURATION
      # ============================================================
      - name: Verify Configuration
        run: |
          echo "=============================================="
          echo "VERIFY XFCE + XRDP"
          echo "=============================================="

          echo
          echo "startxfce4:"
          command -v startxfce4 || true

          echo
          echo "xfce4-session:"
          command -v xfce4-session || true

          echo
          echo "xfconfd:"
          command -v xfconfd || true

          echo
          echo "dbus-run-session:"
          command -v dbus-run-session || true

          echo
          echo "xfce4-terminal:"
          command -v xfce4-terminal || true

          echo
          echo "XRDP:"
          sudo systemctl status xrdp --no-pager || true

          echo
          echo "PORT 3389:"
          sudo ss -lntp | grep ':3389' || true

          echo
          echo "STARTWM:"
          sudo cat /etc/xrdp/startwm.sh

      # ============================================================
      # TAILSCALE
      # ============================================================
      - name: Install Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -e

          if [ -z "$TS_AUTHKEY" ]; then
            echo "ERROR: TS_AUTHKEY belum dibuat di GitHub Secrets."
            exit 1
          fi

          echo "=============================================="
          echo "INSTALL TAILSCALE"
          echo "=============================================="

          curl -fsSL \
            https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="github-linux-rdp-${GITHUB_RUN_ID}"

          sleep 5

          echo
          echo "TAILSCALE STATUS:"
          sudo tailscale status

          echo
          echo "TAILSCALE IP:"
          sudo tailscale ip -4

      # ============================================================
      # SHOW RDP INFORMATION
      # ============================================================
      - name: Show RDP Information
        run: |
          TS_IP=$(sudo tailscale ip -4 | head -1)

          echo
          echo "================================================"
          echo "              LINUX RDP READY"
          echo "================================================"
          echo
          echo "RDP ADDRESS:"
          echo "$TS_IP:3389"
          echo
          echo "USERNAME:"
          echo "rdpuser"
          echo
          echo "PASSWORD:"
          echo "RdpUser@12345"
          echo
          echo "DESKTOP:"
          echo "XFCE4"
          echo
          echo "================================================"

      # ============================================================
      # KEEP RDP ALIVE
      # ============================================================
      - name: Keep RDP Alive
        run: |
          echo "================================================"
          echo "             RDP SEDANG BERJALAN"
          echo "================================================"

          TS_IP=$(sudo tailscale ip -4 | head -1)

          echo
          echo "RDP  : $TS_IP:3389"
          echo "USER : rdpuser"
          echo "PASS : RdpUser@12345"
          echo

          while true; do

            echo
            echo "-----------------------------------------------"
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] SERVER STATUS"
            echo "-----------------------------------------------"

            # ------------------------------------------------------
            # XRDP
            # ------------------------------------------------------
            if sudo systemctl is-active --quiet xrdp; then
              echo "XRDP      : RUNNING"
            else
              echo "XRDP      : STOPPED"
              echo "Restart XRDP..."

              sudo systemctl restart xrdp

              sleep 5

              if sudo systemctl is-active --quiet xrdp; then
                echo "XRDP      : RESTARTED"
              else
                echo "XRDP      : FAILED"
              fi
            fi

            # ------------------------------------------------------
            # PORT
            # ------------------------------------------------------
            if sudo ss -lnt | grep -q ':3389'; then
              echo "PORT 3389 : OPEN"
            else
              echo "PORT 3389 : CLOSED"
            fi

            # ------------------------------------------------------
            # TAILSCALE
            # ------------------------------------------------------
            if sudo tailscale status >/dev/null 2>&1; then
              echo "TAILSCALE  : OK"
            else
              echo "TAILSCALE  : ERROR"
            fi

            echo
            echo "RDP ADDRESS:"
            echo "$TS_IP:3389"

            sleep 60

          done
