name: Debian KVM Desktop MT5

on:
  workflow_dispatch:

jobs:
  debian-kvm:

    runs-on: ubuntu-latest

    timeout-minutes: 350

    env:
      VM_NAME: debian-mt5
      VM_RAM: 4096
      VM_CPUS: 4
      VM_DISK: 20G
      VNC_PORT: 5901
      NOVNC_PORT: 6080

    steps:

      # ============================================================
      # 1. CHECK RUNNER + KVM
      # ============================================================
      - name: Check KVM
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "RUNNER"
          echo "========================================"

          uname -a
          lscpu | head -30
          free -h
          df -h

          echo "========================================"
          echo "CHECK /dev/kvm"
          echo "========================================"

          if [ ! -e /dev/kvm ]; then
            echo ""
            echo "ERROR: /dev/kvm TIDAK TERSEDIA."
            echo ""
            echo "Runner GitHub ini tidak bisa menjalankan"
            echo "VM KVM hardware acceleration."
            echo ""
            echo "Workflow dihentikan."
            exit 1
          fi

          sudo chmod 666 /dev/kvm

          ls -lah /dev/kvm

          echo ""
          echo "KVM tersedia."

      # ============================================================
      # 2. INSTALL QEMU
      # ============================================================
      - name: Install QEMU
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            qemu-kvm \
            cloud-image-utils \
            genisoimage \
            wget \
            curl \
            unzip \
            git \
            jq \
            net-tools \
            socat

          echo "========================================"
          echo "QEMU VERSION"
          echo "========================================"

          qemu-system-x86_64 --version

          echo ""
          echo "KVM:"
          ls -lah /dev/kvm

      # ============================================================
      # 3. DOWNLOAD DEBIAN CLOUD IMAGE
      # ============================================================
      - name: Download Debian 13
        shell: bash
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/vm"

          cd "$RUNNER_TEMP/vm"

          echo "Download Debian 13 cloud image..."

          wget -q --show-progress \
            "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2" \
            -O debian.qcow2

          echo "========================================"
          echo "DEBIAN IMAGE"
          echo "========================================"

          ls -lh debian.qcow2

      # ============================================================
      # 4. RESIZE DISK
      # ============================================================
      - name: Prepare VM Disk
        shell: bash
        run: |
          set -eux

          cd "$RUNNER_TEMP/vm"

          qemu-img info debian.qcow2

          qemu-img resize debian.qcow2 "$VM_DISK"

          echo "========================================"
          echo "DISK AFTER RESIZE"
          echo "========================================"

          qemu-img info debian.qcow2

      # ============================================================
      # 5. CREATE CLOUD INIT
      # ============================================================
      - name: Create Cloud Init
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -eux

          cd "$RUNNER_TEMP/vm"

          if [ -z "$TS_AUTHKEY" ]; then
            echo "ERROR: Secret TS_AUTHKEY belum dibuat."
            exit 1
          fi

          cat > user-data <<EOF
          #cloud-config

          hostname: debian-mt5

          manage_etc_hosts: true

          users:
            - name: debian
              gecos: Debian User
              groups:
                - sudo
              sudo:
                - ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
              lock_passwd: false
              passwd: \$6\$rounds=4096\$abcdefghijklmnop\$abcdefghijklmnopabcdefghijklmnopabcdefghijklmnopabcdefghijklmnopabcdefghijklmnopabcdefghijklmnop

          package_update: true

          packages:

            # Desktop
            - xfce4
            - xfce4-goodies
            - xfce4-terminal

            # Virtual display
            - xvfb
            - x11vnc
            - dbus-x11

            # Wine
            - wine
            - wine64
            - wine32
            - fonts-wine
            - winbind

            # Utilities
            - wget
            - curl
            - ca-certificates
            - unzip
            - git
            - nano
            - htop
            - net-tools
            - procps
            - psmisc
            - iproute2

          write_files:

            - path: /home/debian/.xinitrc
              owner: debian:debian
              permissions: '0755'
              content: |
                #!/bin/bash

                export DISPLAY=:1

                dbus-launch \
                  --exit-with-session \
                  startxfce4

            - path: /home/debian/start-desktop.sh
              owner: debian:debian
              permissions: '0755'
              content: |
                #!/bin/bash

                export DISPLAY=:1

                if ! pgrep -f "Xvfb :1" >/dev/null; then

                  Xvfb :1 \
                    -screen 0 1280x720x24 \
                    -ac \
                    +extension GLX \
                    +render \
                    -noreset \
                    > /home/debian/xvfb.log 2>&1 &

                  sleep 3

                fi

                if ! pgrep -f "xfce4-session" >/dev/null; then

                  dbus-launch \
                    --exit-with-session \
                    startxfce4 \
                    > /home/debian/xfce.log 2>&1 &

                fi

            - path: /home/debian/start-vnc.sh
              owner: debian:debian
              permissions: '0755'
              content: |
                #!/bin/bash

                export DISPLAY=:1

                sleep 10

                if ! pgrep -f "x11vnc.*5900" >/dev/null; then

                  x11vnc \
                    -display :1 \
                    -rfbport 5900 \
                    -forever \
                    -shared \
                    -nopw \
                    -noxdamage \
                    -repeat \
                    > /home/debian/vnc.log 2>&1 &

                fi

            - path: /home/debian/start-mt5.sh
              owner: debian:debian
              permissions: '0755'
              content: |
                #!/bin/bash

                export DISPLAY=:1
                export WINEPREFIX=/home/debian/.wine

                sleep 15

                MT5=""

                if [ -f "/home/debian/.wine/drive_c/Program Files/MetaTrader 5/terminal64.exe" ]; then
                  MT5="/home/debian/.wine/drive_c/Program Files/MetaTrader 5/terminal64.exe"
                fi

                if [ -z "\$MT5" ]; then

                  MT5=\$(find /home/debian/.wine/drive_c \
                    -type f \
                    -iname "terminal64.exe" \
                    2>/dev/null \
                    | head -1)

                fi

                if [ -n "\$MT5" ]; then

                  echo "MT5 ditemukan:"
                  echo "\$MT5"

                  wine "\$MT5" \
                    > /home/debian/mt5.log 2>&1 &

                else

                  echo "MT5 belum ditemukan."

                fi

            - path: /home/debian/install-mt5.sh
              owner: debian:debian
              permissions: '0755'
              content: |
                #!/bin/bash

                export DISPLAY=:1
                export WINEPREFIX=/home/debian/.wine

                cd /home/debian

                if [ ! -f /home/debian/mt5setup.exe ]; then

                  wget -O /home/debian/mt5setup.exe \
                    "https://download.terminal.free/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

                fi

                wineboot -u

                sleep 10

                wine /home/debian/mt5setup.exe \
                  > /home/debian/mt5-install.log 2>&1 &

            - path: /home/debian/start-novnc.sh
              owner: debian:debian
              permissions: '0755'
              content: |
                #!/bin/bash

                if [ ! -d /home/debian/noVNC ]; then

                  cd /home/debian

                  git clone \
                    --depth 1 \
                    https://github.com/novnc/noVNC.git

                  git clone \
                    --depth 1 \
                    https://github.com/novnc/websockify.git \
                    /home/debian/noVNC/utils/websockify

                fi

                cd /home/debian/noVNC

                ./utils/novnc_proxy \
                  --vnc 127.0.0.1:5900 \
                  --listen 0.0.0.0:6080 \
                  > /home/debian/novnc.log 2>&1 &

            - path: /home/debian/install-tailscale.sh
              owner: root:root
              permissions: '0755'
              content: |
                #!/bin/bash

                curl -fsSL \
                  https://tailscale.com/install.sh \
                  | sh

                systemctl enable tailscaled
                systemctl restart tailscaled

                sleep 5

                tailscale up \
                  --authkey="__TS_AUTHKEY__" \
                  --hostname="debian-mt5" \
                  --accept-dns=false

          runcmd:

            # Enable serial console
            - systemctl enable serial-getty@ttyS0.service

            # Desktop
            - su - debian -c "/home/debian/start-desktop.sh"

            # VNC
            - su - debian -c "/home/debian/start-vnc.sh"

            # noVNC
            - su - debian -c "/home/debian/start-novnc.sh"

            # Tailscale
            - sed -i "s/__TS_AUTHKEY__/${TS_AUTHKEY}/g" /home/debian/install-tailscale.sh
            - /home/debian/install-tailscale.sh

            # Wine
            - su - debian -c "WINEPREFIX=/home/debian/.wine wineboot -u"

            # MT5 installer
            - su - debian -c "/home/debian/install-mt5.sh"

            # Start MT5 later
            - sleep 30
            - su - debian -c "/home/debian/start-mt5.sh"

          final_message: "Debian MT5 VM ready."
          EOF

          cat > meta-data <<EOF
          instance-id: debian-mt5
          local-hostname: debian-mt5
          EOF

          cloud-localds \
            seed.iso \
            user-data \
            meta-data

          echo "========================================"
          echo "CLOUD INIT CREATED"
          echo "========================================"

          ls -lh seed.iso

      # ============================================================
      # 6. START DEBIAN KVM
      # ============================================================
      - name: Start Debian KVM
        shell: bash
        run: |
          set -eux

          cd "$RUNNER_TEMP/vm"

          echo "========================================"
          echo "START DEBIAN KVM"
          echo "========================================"

          sudo qemu-system-x86_64 \
            -enable-kvm \
            -machine type=pc,accel=kvm \
            -cpu host \
            -smp "$VM_CPUS" \
            -m "$VM_RAM" \
            -drive file=debian.qcow2,if=virtio,format=qcow2 \
            -drive file=seed.iso,if=virtio,format=raw,readonly=on \
            -netdev user,id=net0,hostfwd=tcp::2222-:22,hostfwd=tcp::5901-:5900,hostfwd=tcp::6080-:6080 \
            -device virtio-net-pci,netdev=net0 \
            -vga virtio \
            -display none \
            -serial mon:stdio \
            -daemonize \
            -pidfile "$RUNNER_TEMP/qemu.pid"

          sleep 10

          echo "QEMU PID:"
          cat "$RUNNER_TEMP/qemu.pid"

          ps aux | grep qemu || true

      # ============================================================
      # 7. WAIT FOR SSH
      # ============================================================
      - name: Wait Debian Boot
        shell: bash
        run: |
          set -eux

          echo "Menunggu Debian boot..."

          for i in $(seq 1 60); do

            if nc -z 127.0.0.1 2222 2>/dev/null; then

              echo "SSH port sudah terbuka."

              break

            fi

            echo "Menunggu... $i/60"

            sleep 5

          done

          if ! nc -z 127.0.0.1 2222 2>/dev/null; then

            echo "Debian belum membuka SSH."

            exit 1

          fi

      # ============================================================
      # 8. WAIT DESKTOP
      # ============================================================
      - name: Wait Debian Desktop
        shell: bash
        run: |
          set -eux

          echo "Menunggu desktop Debian..."

          for i in $(seq 1 60); do

            if nc -z 127.0.0.1 6080 2>/dev/null; then

              echo "noVNC sudah aktif."

              break

            fi

            echo "Menunggu desktop... $i/60"

            sleep 5

          done

          if ! nc -z 127.0.0.1 6080 2>/dev/null; then

            echo "noVNC belum aktif."

            exit 1

          fi

      # ============================================================
      # 9. CHECK TAILSCALE
      # ============================================================
      - name: Get Tailscale IP
        shell: bash
        run: |
          set -eux

          echo "Menunggu Tailscale di dalam VM..."

          for i in $(seq 1 30); do

            TS_IP=$(ssh \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=5 \
              -p 2222 \
              debian@127.0.0.1 \
              "sudo tailscale ip -4 2>/dev/null | head -1" \
              2>/dev/null || true)

            if [ -n "$TS_IP" ]; then

              echo "Tailscale IP:"
              echo "$TS_IP"

              echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"

              break

            fi

            sleep 5

          done

          if [ -z "${TS_IP:-}" ]; then

            echo "Tailscale IP belum tersedia."

            echo "Mungkin cloud-init masih berjalan."

          fi

      # ============================================================
      # 10. FINAL STATUS
      # ============================================================
      - name: Final Test
        shell: bash
        run: |
          set +e

          echo ""
          echo "========================================"
          echo "DEBIAN KVM STATUS"
          echo "========================================"

          echo ""
          echo "QEMU:"
          ps aux | grep qemu | grep -v grep

          echo ""
          echo "KVM:"
          ls -lah /dev/kvm

          echo ""
          echo "LOCAL PORTS:"
          ss -lntp | grep -E "2222|5901|6080"

          echo ""
          echo "========================================"
          echo "TAILSCALE"
          echo "========================================"

          if [ -n "${TS_IP:-}" ]; then

            echo "Tailscale IP:"
            echo "$TS_IP"

            echo ""
            echo "noVNC:"
            echo "http://$TS_IP:6080/vnc.html"

            echo ""
            echo "VNC:"
            echo "$TS_IP:5900"

          fi

          echo ""
          echo "========================================"
          echo "SSH"
          echo "========================================"

          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            debian@127.0.0.1 \
            "echo Debian SSH OK" \
            || true

      # ============================================================
      # 11. KEEP VM ALIVE
      # ============================================================
      - name: Keep Debian KVM Alive
        shell: bash
        run: |
          set +e

          echo ""
          echo "========================================"
          echo "DEBIAN KVM + XFCE + WINE + MT5"
          echo "========================================"

          echo ""
          echo "Tailscale:"
          echo "$TS_IP"

          echo ""
          echo "noVNC:"
          echo "http://$TS_IP:6080/vnc.html"

          echo ""
          echo "========================================"
          echo "VM RUNNING"
          echo "========================================"

          while true; do

            echo ""
            echo "========================================"
            echo "$(date)"
            echo "========================================"

            if [ -f "$RUNNER_TEMP/qemu.pid" ]; then

              QPID=$(cat "$RUNNER_TEMP/qemu.pid")

              if kill -0 "$QPID" 2>/dev/null; then

                echo "QEMU: RUNNING"

              else

                echo "QEMU: STOPPED"

                exit 1

              fi

            fi

            echo ""
            echo "PORTS:"

            ss -lntp | grep -E "2222|5901|6080" || true

            echo ""
            echo "Debian:"

            ssh \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=5 \
              -p 2222 \
              debian@127.0.0.1 \
              "pgrep -af 'Xvfb|xfce|x11vnc|terminal.*exe' || true" \
              2>/dev/null || true

            sleep 60

          done

      # ============================================================
      # 12. DEBUG IF FAILED
      # ============================================================
      - name: Debug
        if: failure()
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "DEBUG"
          echo "========================================"

          echo ""
          echo "QEMU:"
          ps aux | grep qemu || true

          echo ""
          echo "PORTS:"
          ss -lntp || true

          echo ""
          echo "KVM:"
          ls -lah /dev/kvm || true

          echo ""
          echo "SSH:"
          nc -zv 127.0.0.1 2222 || true

          echo ""
          echo "VNC:"
          nc -zv 127.0.0.1 5901 || true

          echo ""
          echo "noVNC:"
          nc -zv 127.0.0.1 6080 || true

          echo ""
          echo "TRY SSH:"
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=5 \
            -p 2222 \
            debian@127.0.0.1 \
            "sudo cloud-init status --long; echo '---'; ps aux; echo '---'; tail -100 /home/debian/mt5.log 2>/dev/null; echo '---'; tail -100 /home/debian/xfce.log 2>/dev/null" \
            || true
