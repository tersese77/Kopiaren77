name: Debian Desktop MT5 Remote

on:
  workflow_dispatch:

jobs:
  debian-mt5:

    runs-on: ubuntu-latest

    timeout-minutes: 355

    env:
      DISPLAY: :99
      VNC_PORT: 5900
      NOVNC_PORT: 6080

    steps:

      # ============================================================
      # 1. CHECK DOCKER
      # ============================================================
      - name: Check Docker
        run: |
          docker version
          docker info

      # ============================================================
      # 2. CREATE DEBIAN CONTAINER
      # ============================================================
      - name: Create Debian Desktop Container
        run: |
          docker pull debian:bookworm

          docker run -d \
            --name debian-mt5 \
            --shm-size=2g \
            -p 5900:5900 \
            -p 6080:6080 \
            debian:bookworm \
            sleep infinity

          docker ps

      # ============================================================
      # 3. INSTALL DEBIAN DESKTOP
      # ============================================================
      - name: Install Debian XFCE Desktop
        run: |
          docker exec debian-mt5 bash -c '
            set -eux

            export DEBIAN_FRONTEND=noninteractive

            apt-get update

            apt-get install -y \
              xfce4 \
              xfce4-goodies \
              xfce4-terminal \
              dbus-x11 \
              xvfb \
              x11vnc \
              wget \
              curl \
              ca-certificates \
              unzip \
              p7zip-full \
              procps \
              net-tools \
              iproute2 \
              git \
              nano \
              sudo \
              locales \
              cabextract \
              winbind \
              software-properties-common
          '

      # ============================================================
      # 4. INSTALL WINE
      # ============================================================
      - name: Install Wine
        run: |
          docker exec debian-mt5 bash -c '
            set -eux

            export DEBIAN_FRONTEND=noninteractive

            dpkg --add-architecture i386

            apt-get update

            apt-get install -y \
              wine \
              wine64 \
              wine32 \
              fonts-wine

            wine --version
          '

      # ============================================================
      # 5. CREATE WINE ENVIRONMENT
      # ============================================================
      - name: Configure Wine
        run: |
          docker exec debian-mt5 bash -c '
            set -eux

            export DISPLAY=:99
            export WINEPREFIX=/root/.wine

            wineboot -u

            sleep 5

            echo "Wine prefix:"
            ls -lah /root/.wine
          '

      # ============================================================
      # 6. START X SERVER
      # ============================================================
      - name: Start Debian Virtual Display
        run: |
          docker exec -d debian-mt5 bash -c '
            export DISPLAY=:99

            Xvfb :99 \
              -screen 0 1280x720x24 \
              -ac \
              +extension GLX \
              +render \
              -noreset \
              > /tmp/xvfb.log 2>&1
          '

          sleep 5

          docker exec debian-mt5 bash -c '
            ps aux | grep Xvfb || true
          '

      # ============================================================
      # 7. START XFCE
      # ============================================================
      - name: Start XFCE Desktop
        run: |
          docker exec -d debian-mt5 bash -c '
            export DISPLAY=:99

            dbus-launch \
              --exit-with-session \
              startxfce4 \
              > /tmp/xfce.log 2>&1
          '

          sleep 10

          docker exec debian-mt5 bash -c '
            ps aux | grep xfce || true
          '

      # ============================================================
      # 8. DOWNLOAD MT5
      # ============================================================
      - name: Download MetaTrader 5
        run: |
          docker exec debian-mt5 bash -c '
            set -eux

            cd /root

            wget -O mt5setup.exe \
              "https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe"

            ls -lh /root/mt5setup.exe
          '

      # ============================================================
      # 9. INSTALL MT5
      # ============================================================
      - name: Install MetaTrader 5
        run: |
          docker exec debian-mt5 bash -c '
            set -eux

            export DISPLAY=:99
            export WINEPREFIX=/root/.wine

            wineboot -u

            sleep 5

            echo "Installing MetaTrader 5..."

            wine /root/mt5setup.exe /auto

            sleep 30

            echo "Searching MT5..."

            find /root/.wine \
              -type f \
              \( -iname "terminal64.exe" -o -iname "terminal.exe" \) \
              -print || true
          '

      # ============================================================
      # 10. FIND MT5
      # ============================================================
      - name: Locate MT5
        run: |
          docker exec debian-mt5 bash -c '
            echo "================================"
            echo "MT5 FILES"
            echo "================================"

            find /root/.wine/drive_c \
              -type f \
              \( -iname "terminal64.exe" -o -iname "terminal.exe" \) \
              -print
          '

      # ============================================================
      # 11. CREATE MT5 START SCRIPT
      # ============================================================
      - name: Create MT5 Launcher
        run: |
          docker exec debian-mt5 bash -c '
            cat > /root/start-mt5.sh << "EOF"
#!/bin/bash

export DISPLAY=:99
export WINEPREFIX=/root/.wine

MT5=$(find /root/.wine/drive_c \
  -type f \
  -iname "terminal64.exe" \
  | head -1)

if [ -z "$MT5" ]; then
  MT5=$(find /root/.wine/drive_c \
    -type f \
    -iname "terminal.exe" \
    | head -1)
fi

if [ -z "$MT5" ]; then
  echo "MT5 executable tidak ditemukan."
  exit 1
fi

echo "Starting MT5:"
echo "$MT5"

wine "$MT5" > /tmp/mt5.log 2>&1 &
EOF

            chmod +x /root/start-mt5.sh
          '

      # ============================================================
      # 12. START MT5
      # ============================================================
      - name: Start MetaTrader 5
        run: |
          docker exec -d debian-mt5 bash -c '
            sleep 5
            /root/start-mt5.sh
          '

          sleep 20

          docker exec debian-mt5 bash -c '
            echo "================================"
            echo "MT5 PROCESS"
            echo "================================"

            ps aux | grep -i terminal || true

            echo ""
            echo "MT5 LOG:"
            tail -100 /tmp/mt5.log 2>/dev/null || true
          '

      # ============================================================
      # 13. START VNC
      # ============================================================
      - name: Start VNC
        run: |
          docker exec -d debian-mt5 bash -c '
            export DISPLAY=:99

            x11vnc \
              -display :99 \
              -rfbport 5900 \
              -forever \
              -shared \
              -nopw \
              -noxdamage \
              -repeat \
              > /tmp/x11vnc.log 2>&1
          '

          sleep 5

          docker exec debian-mt5 bash -c '
            ss -lntp | grep 5900 || true
          '

      # ============================================================
      # 14. INSTALL NOVNC
      # ============================================================
      - name: Install noVNC
        run: |
          docker exec debian-mt5 bash -c '
            set -eux

            cd /opt

            rm -rf noVNC

            git clone \
              --depth 1 \
              https://github.com/novnc/noVNC.git

            git clone \
              --depth 1 \
              https://github.com/novnc/websockify.git \
              /opt/noVNC/utils/websockify
          '

      # ============================================================
      # 15. START NOVNC
      # ============================================================
      - name: Start noVNC
        run: |
          docker exec -d debian-mt5 bash -c '
            cd /opt/noVNC

            ./utils/novnc_proxy \
              --vnc 127.0.0.1:5900 \
              --listen 0.0.0.0:6080 \
              > /tmp/novnc.log 2>&1
          '

          sleep 5

          docker exec debian-mt5 bash -c '
            ss -lntp | grep 6080 || true
          '

      # ============================================================
      # 16. INSTALL TAILSCALE ON RUNNER
      # ============================================================
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

          tailscale version

      # ============================================================
      # 17. START TAILSCALE
      # ============================================================
      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -eux

          if [ -z "$TS_AUTHKEY" ]; then
            echo "TS_AUTHKEY belum dibuat."
            exit 1
          fi

          sudo tailscaled \
            > /tmp/tailscaled.log 2>&1 &

          sleep 5

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="debian-mt5-${GITHUB_RUN_ID}" \
            --accept-dns=false

          sleep 5

          echo "================================"
          echo "TAILSCALE"
          echo "================================"

          tailscale status

          TS_IP=$(tailscale ip -4)

          echo "TAILSCALE IP:"
          echo "$TS_IP"

          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"

      # ============================================================
      # 18. FINAL TEST
      # ============================================================
      - name: Final Test
        run: |
          echo "========================================"
          echo "DEBIAN MT5 REMOTE READY"
          echo "========================================"

          echo ""
          echo "Tailscale IP:"
          echo "$TS_IP"

          echo ""
          echo "noVNC:"
          echo "http://$TS_IP:6080/vnc.html"

          echo ""
          echo "VNC:"
          echo "$TS_IP:5900"

          echo ""
          echo "========================================"
          echo "CONTAINER"
          echo "========================================"

          docker ps

          echo ""
          echo "========================================"
          echo "MT5"
          echo "========================================"

          docker exec debian-mt5 bash -c '
            ps aux | grep -i terminal || true
          '

      # ============================================================
      # 19. KEEP ALIVE
      # ============================================================
      - name: Keep Debian MT5 Alive
        run: |
          echo "========================================"
          echo "DEBIAN DESKTOP + MT5 RUNNING"
          echo "========================================"

          echo ""
          echo "Buka dari HP:"
          echo "http://$TS_IP:6080/vnc.html"

          echo ""
          echo "Tailscale IP:"
          echo "$TS_IP"

          echo ""
          echo "========================================"

          while true; do

            echo ""
            echo "----- $(date) -----"

            echo "Container:"
            docker ps --filter name=debian-mt5

            echo ""
            echo "MT5:"
            docker exec debian-mt5 bash -c '
              pgrep -af "terminal.*exe" || true
            '

            echo ""
            echo "VNC:"
            docker exec debian-mt5 bash -c '
              ss -lntp | grep 5900 || true
            '

            echo ""
            echo "noVNC:"
            docker exec debian-mt5 bash -c '
              ss -lntp | grep 6080 || true
            '

            sleep 60

          done

      # ============================================================
      # 20. DEBUG
      # ============================================================
      - name: Debug Logs
        if: failure()
        run: |
          echo "================================"
          echo "DEBUG"
          echo "================================"

          docker ps -a

          echo ""
          echo "XFCE:"
          docker exec debian-mt5 \
            tail -100 /tmp/xfce.log 2>/dev/null || true

          echo ""
          echo "MT5:"
          docker exec debian-mt5 \
            tail -200 /tmp/mt5.log 2>/dev/null || true

          echo ""
          echo "VNC:"
          docker exec debian-mt5 \
            tail -100 /tmp/x11vnc.log 2>/dev/null || true

          echo ""
          echo "noVNC:"
          docker exec debian-mt5 \
            tail -100 /tmp/novnc.log 2>/dev/null || true

          echo ""
          echo "Xvfb:"
          docker exec debian-mt5 \
            tail -100 /tmp/xvfb.log 2>/dev/null || true
