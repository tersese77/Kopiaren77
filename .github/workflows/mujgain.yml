name: Linux RDP XFCE

on:
  workflow_dispatch:

jobs:
  linux-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: Check Server
        run: |
          echo "=============================================="
          echo "             LINUX RDP XFCE"
          echo "=============================================="

          echo
          echo "OS:"
          cat /etc/os-release

          echo
          echo "CPU:"
          nproc

          echo
          echo "RAM:"
          free -h

          echo
          echo "DISK:"
          df -h /

      - name: Install XFCE XRDP DBUS
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-session \
            xfconf \
            xfdesktop4 \
            xfwm4 \
            xfce4-terminal \
            xrdp \
            xorgxrdp \
            dbus \
            dbus-x11 \
            dbus-user-session \
            dbus-daemon \
            xauth \
            policykit-1 \
            sudo \
            curl \
            wget

          echo
          echo "=============================================="
          echo "XFCE COMPONENTS"
          echo "=============================================="

          command -v startxfce4 || true
          command -v xfce4-session || true
          command -v xfconfd || true
          command -v dbus-run-session || true
          command -v xrdp || true

          echo
          echo "XFCE installation selesai."

      - name: Create RDP User
        run: |
          set -e

          USERNAME="rdpuser"
          PASSWORD="RdpUser@12345"

          if id "$USERNAME" >/dev/null 2>&1; then
            echo "User sudah ada."
          else
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$USERNAME"
          fi

          echo "$USERNAME:$PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo "$USERNAME"

          HOME_DIR="/home/$USERNAME"

          sudo mkdir -p \
            "$HOME_DIR/.config/xfce4" \
            "$HOME_DIR/.cache/sessions"

          sudo chown -R \
            "$USERNAME:$USERNAME" \
            "$HOME_DIR"

          echo "RDP user berhasil dibuat."

      - name: Configure XFCE Session
        run: |
          set -e

          USERNAME="rdpuser"
          HOME_DIR="/home/$USERNAME"

          sudo -u "$USERNAME" rm -rf \
            "$HOME_DIR/.cache/sessions"

          sudo -u "$USERNAME" rm -rf \
            "$HOME_DIR/.config/xfce4/xfconf"

          sudo -u "$USERNAME" mkdir -p \
            "$HOME_DIR/.config/xfce4"

          sudo tee "$HOME_DIR/.xsession" > /dev/null <<'EOF'
          #!/bin/sh

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce

          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export XDG_DATA_DIRS=/usr/local/share:/usr/share

          unset DBUS_SESSION_BUS_ADDRESS
          unset DBUS_STARTER_BUS_TYPE
          unset DBUS_STARTER_ADDRESS

          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod +x "$HOME_DIR/.xsession"

          sudo chown \
            "$USERNAME:$USERNAME" \
            "$HOME_DIR/.xsession"

          echo "XFCE session configured."

      - name: Configure XRDP
        run: |
          set -e

          sudo cp \
            /etc/xrdp/startwm.sh \
            /etc/xrdp/startwm.sh.backup

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce

          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export XDG_DATA_DIRS=/usr/local/share:/usr/share

          unset DBUS_SESSION_BUS_ADDRESS
          unset DBUS_STARTER_BUS_TYPE
          unset DBUS_STARTER_ADDRESS

          if [ -r /etc/profile ]; then
            . /etc/profile
          fi

          if [ -r "$HOME/.profile" ]; then
            . "$HOME/.profile"
          fi

          exec "$HOME/.xsession"
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          sudo adduser xrdp ssl-cert || true

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          sleep 5

          echo
          echo "XRDP:"
          sudo systemctl is-active xrdp

          echo
          echo "PORT:"
          sudo ss -lntp | grep ':3389' || true

      - name: Verify Configuration
        run: |
          echo "=============================================="
          echo "VERIFY"
          echo "=============================================="

          echo
          echo "startxfce4:"
          command -v startxfce4 || true

          echo
          echo "xfce4-session:"
          command -v xfce4-session || true

          echo
          echo "xfconfd:"
          command -v xfconfd || true

          echo
          echo "dbus-run-session:"
          command -v dbus-run-session || true

          echo
          echo "XRDP:"
          sudo systemctl status xrdp --no-pager || true

          echo
          echo "PORT 3389:"
          sudo ss -lntp | grep ':3389' || true

      - name: Install Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -e

          if [ -z "$TS_AUTHKEY" ]; then
            echo "ERROR: TS_AUTHKEY belum dibuat."
            exit 1
          fi

          curl -fsSL \
            https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="github-linux-rdp-${GITHUB_RUN_ID}"

          sleep 5

          echo
          echo "TAILSCALE STATUS:"
          sudo tailscale status

          echo
          echo "TAILSCALE IP:"
          sudo tailscale ip -4

      - name: Show RDP Information
        run: |
          TS_IP=$(sudo tailscale ip -4 | head -1)

          echo
          echo "=============================================="
          echo "             LINUX RDP READY"
          echo "=============================================="
          echo
          echo "ADDRESS : $TS_IP:3389"
          echo "USER    : rdpuser"
          echo "PASS    : RdpUser@12345"
          echo "DESKTOP : XFCE4"
          echo
          echo "=============================================="

      - name: Keep RDP Alive
        run: |
          TS_IP=$(sudo tailscale ip -4 | head -1)

          echo "=============================================="
          echo "             RDP AKTIF"
          echo "=============================================="
          echo
          echo "RDP  : $TS_IP:3389"
          echo "USER : rdpuser"
          echo "PASS : RdpUser@12345"
          echo

          while true; do

            if sudo systemctl is-active --quiet xrdp; then
              echo "[$(date '+%H:%M:%S')] XRDP: RUNNING"
            else
              echo "XRDP mati, restart..."
              sudo systemctl restart xrdp
            fi

            if sudo ss -lnt | grep -q ':3389'; then
              echo "[$(date '+%H:%M:%S')] PORT 3389: OPEN"
            else
              echo "[$(date '+%H:%M:%S')] PORT 3389: CLOSED"
            fi

            echo "RDP: $TS_IP:3389"
            echo

            sleep 60

          done
